<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KS3 Computing: Handling Data Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                        display: ['Nunito', 'sans-serif'],
                    },
                    colors: {
                        charcoal: {
                            900: '#1e2025',
                            950: '#0a0b0d',
                        },
                        brandOrange: { 500: '#f97316', 600: '#ea580c' },
                        brandYellow: { 500: '#eab308' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-charcoal-950 text-slate-100 min-h-screen font-sans flex flex-col justify-between selection:bg-brandOrange-500 selection:text-white overflow-x-hidden">

    <!-- TOP NAVIGATION BAR -->
    <header class="border-b-4 border-white/10 bg-charcoal-900 sticky top-0 z-50 shadow-xl">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-brandOrange-500/10 text-brandOrange-500 flex items-center justify-center border-2 border-brandOrange-500/30">
                    <i class="fa-solid fa-server text-2xl"></i>
                </div>
                <div>
                    <span class="text-sm font-black tracking-widest text-brandOrange-500 uppercase font-display block">jkhe / computingTeaching</span>
                    <h1 class="text-2xl font-extrabold font-display text-white">KS3: Handling Data</h1>
                </div>
            </div>
            <div>
                <a href="https://github.com/jkhe/computingTeaching" target="_blank" class="text-sm font-bold bg-white/5 hover:bg-white/10 text-slate-300 px-4 py-2 rounded-xl border border-white/10 transition-colors flex items-center gap-2">
                    <i class="fa-brands fa-github text-lg"></i>
                    GitHub
                </a>
            </div>
        </div>
    </header>

    <!-- MAIN BODY PORTAL -->
    <main class="max-w-7xl mx-auto px-6 py-12 w-full flex-grow">
        
        <!-- LESSONS PROGRESSION GRID -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 mt-4">
            
            <!-- LESSON 1 -->
            <div class="bg-charcoal-900 border-2 border-white/10 hover:border-brandOrange-500 rounded-3xl p-8 transition-all duration-300 flex flex-col justify-between shadow-lg group">
                <div class="mb-10">
                    <h2 class="text-5xl font-black text-white font-display mb-2 group-hover:text-brandOrange-500 transition-colors">Lesson 1</h2>
                    <p class="text-2xl text-slate-400 font-bold">What is Data?</p>
                </div>
                <a href="ks3_l1_handling_data_interactive.html" class="w-full text-center py-4 px-6 rounded-xl bg-brandOrange-500 text-white hover:bg-brandOrange-600 font-black text-xl transition-colors shadow-md">
                    Launch
                </a>
            </div>

            <!-- LESSON 2 -->
            <div class="bg-charcoal-900 border-2 border-white/10 hover:border-brandYellow-500 rounded-3xl p-8 transition-all duration-300 flex flex-col justify-between shadow-lg group">
                <div class="mb-10">
                    <h2 class="text-5xl font-black text-white font-display mb-2 group-hover:text-brandYellow-500 transition-colors">Lesson 2</h2>
                    <p class="text-2xl text-slate-400 font-bold">Planning Data Collection</p>
                </div>
                <a href="ks3_l2_planning_collection_interactive.html" class="w-full text-center py-4 px-6 rounded-xl bg-brandYellow-500 text-charcoal-950 hover:bg-brandYellow-400 font-black text-xl transition-colors shadow-md">
                    Launch
                </a>
            </div>

            <!-- LESSON 3 -->
            <div class="bg-charcoal-900 border-2 border-white/10 hover:border-brandOrange-500 rounded-3xl p-8 transition-all duration-300 flex flex-col justify-between shadow-lg group">
                <div class="mb-10">
                    <h2 class="text-5xl font-black text-white font-display mb-2 group-hover:text-brandOrange-500 transition-colors">Lesson 3</h2>
                    <p class="text-2xl text-slate-400 font-bold">The Field Trip</p>
                </div>
                <a href="ks3_l3_field_trip_interactive.html" class="w-full text-center py-4 px-6 rounded-xl bg-brandOrange-500 text-white hover:bg-brandOrange-600 font-black text-xl transition-colors shadow-md">
                    Launch
                </a>
            </div>

            <!-- LESSON 4 (Locked) -->
            <div class="bg-charcoal-900 border-2 border-white/5 rounded-3xl p-8 flex flex-col justify-between opacity-50 relative">
                <div class="mb-10">
                    <h2 class="text-5xl font-black text-slate-500 font-display mb-2">Lesson 4</h2>
                    <p class="text-2xl text-slate-600 font-bold">Spreadsheet Entry</p>
                </div>
                <button disabled class="w-full text-center py-4 px-6 rounded-xl bg-black/40 text-slate-600 font-black text-xl cursor-not-allowed border border-white/5">
                    <i class="fa-solid fa-lock mr-2"></i> Locked
                </button>
            </div>

            <!-- LESSON 5 (Locked) -->
            <div class="bg-charcoal-900 border-2 border-white/5 rounded-3xl p-8 flex flex-col justify-between opacity-50 relative">
                <div class="mb-10">
                    <h2 class="text-5xl font-black text-slate-500 font-display mb-2">Lesson 5</h2>
                    <p class="text-2xl text-slate-600 font-bold">Formulas</p>
                </div>
                <button disabled class="w-full text-center py-4 px-6 rounded-xl bg-black/40 text-slate-600 font-black text-xl cursor-not-allowed border border-white/5">
                    <i class="fa-solid fa-lock mr-2"></i> Locked
                </button>
            </div>

            <!-- LESSON 6 (Locked) -->
            <div class="bg-charcoal-900 border-2 border-white/5 rounded-3xl p-8 flex flex-col justify-between opacity-50 relative">
                <div class="mb-10">
                    <h2 class="text-5xl font-black text-slate-500 font-display mb-2">Lesson 6</h2>
                    <p class="text-2xl text-slate-600 font-bold">Analyzing Charts</p>
                </div>
                <button disabled class="w-full text-center py-4 px-6 rounded-xl bg-black/40 text-slate-600 font-black text-xl cursor-not-allowed border border-white/5">
                    <i class="fa-solid fa-lock mr-2"></i> Locked
                </button>
            </div>

        </div>
    </main>

</body>
</html>
