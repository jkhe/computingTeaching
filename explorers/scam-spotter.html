<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spot the scam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/explorer.css?v=2">
<style>
  /* Page-specific styles only. */
  body { --pulse: #4338CA; }

  /* The message, in a plain mail-app frame */
  .sc-mail {
    width: min(1000px, 100%);
    flex: 0 1 auto; min-height: 0;
    border: 2px solid var(--line-strong); border-radius: 12px; overflow: hidden;
    display: flex; flex-direction: column; background: var(--panel);
  }
  .sc-bar {
    display: flex; align-items: center; gap: 10px;
    background: #F3F4F6; border-bottom: 2px solid var(--line-strong);
    padding: 3px 14px; font-size: 14px; font-weight: 800; color: var(--muted);
  }
  .sc-bar svg { flex-shrink: 0; }
  .sc-head { padding: 6px 12px 5px; border-bottom: 2px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
  .sc-body { padding: 6px 12px 8px; display: flex; flex-direction: column; gap: 4px; }
  .sc-line { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; font-size: 22px; line-height: 1.3; }
  .sc-head .sc-line.subject { font-size: 25px; font-weight: 800; padding-left: 6px; }
  .sc-avatar {
    width: 30px; height: 30px; border-radius: 50%; background: var(--muted); color: #fff;
    display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 17px; flex-shrink: 0;
  }

  /* Every part of the message can be clicked. All parts look the same until clicked. */
  .sc-part {
    display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 1px 8px; border-radius: 8px; border: 2px solid transparent; cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .sc-part:hover { background: #F3F4F6; border-color: var(--line-strong); }
  .sc-part.found { background: var(--bad-soft); border-color: var(--bad); cursor: default; }
  .sc-part.safe { animation: sc-safe 1.2s ease; }
  .sc-part.nudge { border-color: var(--accent); border-style: dashed; }
  @keyframes sc-safe { 0%, 60% { background: #E5E7EB; border-color: var(--muted); } 100% { background: transparent; border-color: transparent; } }
  .sc-flag {
    font-size: 14px; font-weight: 800; color: #fff; background: var(--bad);
    border-radius: 999px; padding: 1px 10px; white-space: nowrap; animation: ex-fade 0.3s ease;
  }
  /* The exact giveaway (e.g. the 1 that should be an l) is marked once found. */
  .sc-mark { border-radius: 3px; }
  .sc-part.found .sc-mark { background: #FDE68A; color: var(--bad); box-shadow: 0 0 0 2px var(--bad); }
  .sc-fakebtn {
    display: inline-block; background: #1F2937; color: #fff; font-weight: 800; font-size: 18px;
    border-radius: 8px; padding: 3px 18px;
  }
  .sc-addr { font-size: 17px; color: var(--muted); }
  .sc-addr b { color: var(--text); font-weight: 800; letter-spacing: 0.5px; }

  /* ----- Start screen demo: the pointer clicks a line and it is flagged ----- */
  .sc-d-bar { position: absolute; left: 36px; height: 14px; border-radius: 7px; background: #D1D5DB; }
  .sc-d-bar.a { top: 26px; width: 160px; background: #9CA3AF; }
  .sc-d-bar.b { top: 58px; width: 230px; }
  .sc-d-bar.d { top: 122px; width: 200px; }
  .sc-d-hit { position: absolute; left: 28px; top: 82px; width: 200px; height: 28px; border-radius: 8px; border: 2px solid transparent; animation: sc-d-hit 3.4s ease infinite; }
  .sc-d-hit .sc-d-bar { left: 6px; top: 5px; width: 130px; }
  .sc-d-flag { position: absolute; left: 146px; top: 4px; width: 48px; height: 16px; border-radius: 8px; background: var(--bad); opacity: 0; animation: sc-d-flag 3.4s ease infinite; }
  .sc-d-ptr { position: absolute; left: 0; top: 0; width: 30px; height: 30px; animation: sc-d-ptr 3.4s ease-in-out infinite; }
  .sc-d-ptr .ex-ghost { left: 0; top: 0; }
  .sc-d-arrow { display: none; }
  @keyframes sc-d-ptr { 0% { transform: translate(270px, 140px); } 35%, 100% { transform: translate(110px, 92px); } }
  @keyframes sc-d-hit { 0%, 38% { background: transparent; border-color: transparent; } 44%, 90% { background: var(--bad-soft); border-color: var(--bad); } 100% { background: transparent; border-color: transparent; } }
  @keyframes sc-d-flag { 0%, 42% { opacity: 0; } 50%, 90% { opacity: 1; } 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .sc-d-ptr, .sc-d-hit, .sc-d-flag { animation: none !important; }
    .sc-d-ptr { transform: translate(150px, 130px); }
    .sc-d-hit { background: var(--bad-soft); border-color: var(--bad); }
    .sc-d-flag { opacity: 1; }
    .sc-d-arrow { display: block; position: absolute; left: 186px; top: 118px; width: 4px; height: 12px; background: var(--accent); }
    .sc-d-arrow::before { content: ""; position: absolute; left: -8px; top: -12px; border: 10px solid transparent; border-top: 0; border-bottom: 14px solid var(--accent); }
  }

  @media (max-width: 1100px), (max-height: 620px) {
    .sc-line { font-size: 17px; }
    .sc-head .sc-line.subject { font-size: 19px; }
    .sc-body { gap: 2px; padding: 4px 10px 6px; }
    .sc-head { padding: 4px 10px 3px; }
    .sc-flag { font-size: 13px; }
    .sc-addr { font-size: 15px; }
    .sc-fakebtn { font-size: 16px; padding: 2px 16px; }
    .sc-avatar { width: 26px; height: 26px; font-size: 15px; }
  }
</style>
</head>
<body class="unit-1 ex-v2">

<!-- SCREEN 1: Start -->
<section class="ex-screen ex-start" id="ex-start">
  <h1>Spot the scam</h1>
  <p class="ex-why">Spotting scams keeps your money and accounts safe.</p>
  <div class="ex-demo" aria-hidden="true">
    <span class="sc-d-bar a"></span>
    <span class="sc-d-bar b"></span>
    <span class="sc-d-hit"><span class="sc-d-bar"></span><span class="sc-d-flag"></span></span>
    <span class="sc-d-bar d"></span>
    <span class="sc-d-arrow"></span>
    <span class="sc-d-ptr"><svg class="ex-ghost" viewBox="0 0 24 24"><path d="M5 2l14 11h-7.2l4 7.6-3 1.6-4-7.7L5 19z"/></svg></span>
  </div>
  <p class="ex-how">Click anything that looks wrong.</p>
  <button type="button" class="ex-btn primary big" id="ex-go">Start</button>
</section>

<!-- SCREEN 2: Explore -->
<section class="ex-screen" id="ex-explore" hidden>
  <div class="ex-top">
    <span class="ex-steps" id="ex-steps" aria-hidden="true"><i></i><i></i></span>
    <p class="ex-instruction" id="ex-instruction">Find all 6 warning signs.</p>
    <button type="button" class="ex-quiet" id="ex-reset">Start again</button>
  </div>
  <div class="ex-area">
    <div class="sc-mail" id="sc-mail" role="group" aria-label="Message. Every part can be clicked.">
      <div class="sc-bar">
        <svg width="20" height="16" viewBox="0 0 20 16" aria-hidden="true"><rect x="1" y="1" width="18" height="14" rx="2" fill="#fff" stroke="#6B7280" stroke-width="2"/><path d="M2 3l8 6 8-6" fill="none" stroke="#6B7280" stroke-width="2"/></svg>
        <span>Inbox</span>
      </div>
      <div class="sc-head" id="sc-head"></div>
      <div class="sc-body" id="sc-body"></div>
    </div>
    <p class="ex-status" id="ex-status" role="status"></p>
  </div>
</section>

<script src="shared/explorer.js?v=2"></script>
<script>
  (function () {
    "use strict";

    /* Both messages are invented. ParcelPoint and Pixelfort are made-up names
       and every address uses the reserved .example ending, so none can be real.
       Nothing on this page is a real link.

       Each part: t = text, sign = index into signs (or missing if the part is
       normal), mark = the exact characters to mark once that sign is found.
       kind "link" draws a pretend button with its address shown beside it.
       Each sign has a short label (shown on the flag) and a hint that names
       the area to look at, never the answer. */
    var MESSAGES = [
      {
        initial: "P",
        signs: [
          { label: "Odd sender address", hint: "Look at who sent it." },
          { label: "Does not use your name", hint: "Look at how it starts." },
          { label: "Spelling mistake", hint: "Read the first sentence slowly." },
          { label: "Rushes you", hint: "Look for a time limit." },
          { label: "Asks for card details", hint: "Look at what it asks you to give." },
          { label: "Fake link: 1, not l", hint: "Look closely at where the link goes." }
        ],
        head: [
          { cls: "subject", parts: [{ t: "Your parcel delivery" }] },
          { avatar: true, parts: [{ t: "From: ParcelPoint <support@parcelpoint-help.example>", mark: "-help", sign: 0 }] }
        ],
        body: [
          [{ t: "Dear customer,", sign: 1 }],
          [{ t: "You parcel is waiting at our depot.", mark: "You", sign: 2 }, { t: "We tried to deliver it today." }],
          [{ t: "Pay within 2 hours or your parcel will be returned.", mark: "within 2 hours", sign: 3 }],
          [{ t: "Enter your card details to pay the £1.99 fee.", mark: "card details", sign: 4 }],
          [{ kind: "link", button: "Pay now", addr: "parce1point.example/pay", mark: "1", sign: 5 }],
          [{ t: "Thank you, The ParcelPoint Team" }, { t: "www.parcelpoint.example" }]
        ]
      },
      {
        initial: "P",
        signs: [
          { label: "Rushes you", hint: "Look for a time limit." },
          { label: "Asks for your password", hint: "Look at what it asks you to do." },
          { label: "Fake link: 0, not o", hint: "Look closely at where the link goes." }
        ],
        head: [
          { cls: "subject", parts: [{ t: "News from Pixelfort" }] },
          { avatar: true, parts: [{ t: "From: Pixelfort <rewards@pixelfort.example>" }] }
        ],
        body: [
          [{ t: "Hi Jay_Plays," }],
          [{ t: "Thank you for playing Pixelfort this year." }],
          [{ t: "Claim 5,000 free coins in the next 10 minutes or they are gone.", mark: "in the next 10 minutes", sign: 0 }],
          [{ t: "Log in with your password to get your coins.", mark: "password", sign: 1 }],
          [{ kind: "link", button: "Claim coins", addr: "pixelf0rt.example/login", mark: "0", sign: 2 }],
          [{ t: "See you in the game, The Pixelfort Team" }, { t: "www.pixelfort.example" }]
        ]
      }
    ];

    var headEl = document.getElementById("sc-head");
    var bodyEl = document.getElementById("sc-body");

    var current = 0, found = [], partEls = [];

    function count() { return found.filter(Boolean).length; }
    function total() { return MESSAGES[current].signs.length; }
    function allFound() { return count() === total(); }
    function countText() { return "Found " + count() + " of " + total(); }

    function clearNudge() {
      partEls.forEach(function (p) { p.el.classList.remove("nudge"); });
    }

    function choose(el, part) {
      clearNudge();
      if (part.sign === undefined) {
        el.classList.remove("safe");
        void el.offsetWidth;            /* restart the short grey flash */
        el.classList.add("safe");
        if (!allFound()) Explorer.status("That part looks normal.");
        Explorer.used();
        return;
      }
      if (found[part.sign]) return;
      var msg = MESSAGES[current];
      found[part.sign] = true;
      el.classList.add("found");
      el.setAttribute("aria-label", el.getAttribute("data-name") + ". Warning sign: " + msg.signs[part.sign].label);
      var flag = document.createElement("span");
      flag.className = "sc-flag";
      flag.textContent = msg.signs[part.sign].label;
      el.appendChild(flag);
      if (!allFound()) Explorer.status(countText());
      Explorer.used();                  /* checks for success */
    }

    /* Text with the giveaway characters wrapped, so they can be marked. */
    function markedText(parent, text, mark) {
      var at = mark ? text.indexOf(mark) : -1;
      if (at < 0) { parent.appendChild(document.createTextNode(text)); return; }
      parent.appendChild(document.createTextNode(text.slice(0, at)));
      var m = document.createElement("span");
      m.className = "sc-mark";
      m.textContent = mark;
      parent.appendChild(m);
      parent.appendChild(document.createTextNode(text.slice(at + mark.length)));
    }

    function makePart(part) {
      var el = document.createElement("span");
      el.className = "sc-part";
      el.setAttribute("role", "button");
      el.setAttribute("tabindex", "0");
      if (part.kind === "link") {
        var b = document.createElement("span");
        b.className = "sc-fakebtn";
        b.textContent = part.button;
        var a = document.createElement("span");
        a.className = "sc-addr";
        a.appendChild(document.createTextNode("Link goes to: "));
        var strong = document.createElement("b");
        markedText(strong, part.addr, part.mark);
        a.appendChild(strong);
        el.appendChild(b);
        el.appendChild(a);
        el.setAttribute("data-name", part.button + " button. Link goes to " + part.addr);
      } else {
        var s = document.createElement("span");
        markedText(s, part.t, part.mark);
        el.appendChild(s);
        el.setAttribute("data-name", part.t);
      }
      el.setAttribute("aria-label", el.getAttribute("data-name"));
      el.addEventListener("click", function () { choose(el, part); });
      el.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") {
          e.preventDefault();
          choose(el, part);
        }
      });
      partEls.push({ el: el, sign: part.sign });
      return el;
    }

    function makeLine(parts, cls, avatar, initial) {
      var line = document.createElement("div");
      line.className = "sc-line" + (cls ? " " + cls : "");
      if (avatar) {
        var av = document.createElement("span");
        av.className = "sc-avatar";
        av.setAttribute("aria-hidden", "true");
        av.textContent = initial;
        line.appendChild(av);
      }
      parts.forEach(function (p) { line.appendChild(makePart(p)); });
      return line;
    }

    function load(index) {
      current = index;
      var msg = MESSAGES[current];
      found = [];
      partEls = [];
      headEl.textContent = "";
      bodyEl.textContent = "";
      msg.head.forEach(function (h) { headEl.appendChild(makeLine(h.parts, h.cls, h.avatar, msg.initial)); });
      msg.body.forEach(function (parts) { bodyEl.appendChild(makeLine(parts)); });
      Explorer.status(countText());
    }

    /* Guidance after a while: name one area that still has a sign in it,
       and outline that part. */
    function hint() {
      var msg = MESSAGES[current];
      for (var i = 0; i < msg.signs.length; i++) {
        if (found[i]) continue;
        clearNudge();
        partEls.forEach(function (p) { if (p.sign === i) p.el.classList.add("nudge"); });
        return msg.signs[i].hint;
      }
      return "";
    }

    Explorer.setup({
      /* Step 1: all 6 signs found in the first message. */
      pulse: "#sc-mail",
      success: allFound,
      successText: "All 6 found. Don't click. Tell an adult.",
      hint: hint,
      hintAfter: 60,
      onReset: function () { load(0); },
      /* Step 2: the harder message loads, with 3 signs. */
      challenge: {
        text: "This one is harder. Find the 3 warning signs.",
        start: function () { load(1); },
        success: allFound,
        successText: "All 3 found. Don't click. Tell an adult.",
        hint: hint,
        pulse: "#sc-mail"
      }
    });

    load(0);
  })();
</script>
</body>
</html>
