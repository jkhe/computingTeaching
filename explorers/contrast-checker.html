<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Can you read it?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/explorer.css?v=7">
<style>
  /* Page-specific styles only. */
  body { --hint: #6D28D9; }   /* hints in purple, so they never look like a rating */

  .cc-svg { display: block; }
  .cc-svg text { font-family: var(--font); font-weight: 800; }
  .cc-poster { flex-shrink: 0; border: 2px solid var(--line-strong); border-radius: 8px; overflow: hidden; }

  /* The rating, in the class's words, is the one status line. */
  .ex-v2 .ex-status.hard { color: var(--bad); }
  .ex-v2 .ex-status.ok { color: var(--ok); }

  /* Colour swatches: the one control, right under the poster. */
  .cc-swatches { display: flex; gap: 14px; flex-shrink: 0; padding: 6px; border-radius: 16px; }
  .cc-swatch {
    width: 52px; height: 52px; border-radius: 12px;
    border: 2px solid #6B7280; cursor: pointer; padding: 0;
    transition: transform 0.1s;
  }
  .cc-swatch:active { transform: scale(0.95); }
  .cc-swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--text); }
  .cc-swatch:focus-visible { outline: 3px solid var(--accent); outline-offset: 7px; }

  /* ----- Start screen demo: a pointer clicks a swatch and the words change colour ----- */
  .cc-d-poster { position: absolute; left: 50px; top: 12px; width: 220px; height: 92px; border-radius: 6px; background: linear-gradient(#FFEDB3, #FCCCDB); }
  .cc-d-words { position: absolute; left: 0; right: 0; top: 18px; text-align: center; font-weight: 800; font-size: 22px; line-height: 1.2; color: #FFF6CC; animation: cc-d-words 3.4s steps(1) infinite; }
  .cc-d-words small { display: block; font-size: 14px; }
  .cc-d-sw { position: absolute; top: 118px; width: 34px; height: 34px; border-radius: 8px; border: 2px solid #6B7280; }
  .cc-d-sw.a { left: 72px; background: #FFF6CC; animation: cc-d-a 3.4s steps(1) infinite; }
  .cc-d-sw.b { left: 122px; background: #F28C1E; }
  .cc-d-sw.c { left: 172px; background: #5B21B6; }
  .cc-d-sw.d { left: 222px; background: #111B3D; animation: cc-d-d 3.4s steps(1) infinite; }
  .cc-d-ghost { position: absolute; left: 0; top: 0; animation: cc-d-ghost 3.4s ease-in-out infinite; }
  .cc-d-ghost .ex-ghost { left: 0; top: 0; }
  @keyframes cc-d-ghost { 0%, 15% { transform: translate(90px, 134px); } 45%, 100% { transform: translate(240px, 134px); } }
  @keyframes cc-d-words { 0% { color: #FFF6CC; } 48% { color: #111B3D; } }
  @keyframes cc-d-a { 0% { box-shadow: 0 0 0 2px #fff, 0 0 0 4px #374151; } 48% { box-shadow: none; } }
  @keyframes cc-d-d { 0% { box-shadow: none; } 48% { box-shadow: 0 0 0 2px #fff, 0 0 0 4px #374151; } }
  @media (prefers-reduced-motion: reduce) {
    /* Still frame: the pointer on the dark swatch, the words already dark. */
    .cc-d-ghost, .cc-d-words, .cc-d-sw { animation: none !important; }
    .cc-d-ghost { transform: translate(240px, 134px); }
    .cc-d-words { color: #111B3D; }
    .cc-d-sw.d { box-shadow: 0 0 0 2px #fff, 0 0 0 4px #374151; }
  }

  @media (max-width: 1100px), (max-height: 620px) {
    .cc-swatch { width: 46px; height: 46px; }
    .cc-swatches { gap: 12px; }
  }
</style>
</head>
<body class="unit-2 ex-v2">

<!-- SCREEN 1: Start -->
<section class="ex-screen ex-start" id="ex-start">
  <h1>Can you read it?</h1>
  <p class="ex-why">Easy-to-read colours make people stop and read your poster.</p>
  <div class="ex-demo" aria-hidden="true">
    <span class="cc-d-poster"><span class="cc-d-words">BAKE SALE<small>Friday</small></span></span>
    <span class="cc-d-sw a"></span><span class="cc-d-sw b"></span><span class="cc-d-sw c"></span><span class="cc-d-sw d"></span>
    <span class="cc-d-ghost"><svg class="ex-ghost" viewBox="0 0 24 24"><path d="M5 2l14 11h-7.2l4 7.6-3 1.6-4-7.7L5 19z"/></svg></span>
  </div>
  <p class="ex-how">Pick a text colour.</p>
  <button type="button" class="ex-btn primary big" id="ex-go">Start</button>
</section>

<!-- SCREEN 2: Explore -->
<section class="ex-screen" id="ex-explore" hidden>
  <div class="ex-top">
    <span class="ex-steps" id="ex-steps" aria-hidden="true"><i></i><i></i></span>
    <p class="ex-instruction" id="ex-instruction">Find two text colours that are Easy to read.</p>
    <button type="button" class="ex-quiet" id="ex-reset">Start again</button>
  </div>
  <div class="ex-area" id="cc-area">
    <div class="cc-poster" id="cc-poster"></div>
    <div class="cc-swatches" id="cc-swatches" role="group" aria-label="Text colour"></div>
    <p class="ex-status" id="ex-status" role="status"></p>
  </div>
</section>

<script src="shared/explorer.js?v=7"></script>
<script>
  (function () {
    "use strict";

    /* Contrast is worked out with the WCAG 2 contrast ratio formula.
       The poster background is a gradient, so the ratio is worked out against
       BOTH ends and the LOWER one is used (the worst case).
       Bands, using the class's words:
         below 3        Hard to read
         3 to 4.49      OK
         4.5 and above  Easy to read
       Ratios for these colours (lowest of the two gradient ends):
                        light background   dark background
         Pale yellow        1.07  Hard        8.26  Easy
         Light pink         1.16  Hard        5.47  Easy
         Light grey         1.04  Hard        6.10  Easy
         Mid grey           3.41  OK          1.86  Hard
         Orange             1.73  Hard        3.66  OK
         Mid blue           3.33  OK          1.90  Hard
         Dark purple        6.33  Easy        1.00  Hard
         Navy              11.86  Easy        1.62  Hard                      */
    var COLOURS = [
      { name: "Pale yellow", hex: "#FFF6CC" },
      { name: "Light pink",  hex: "#F9B8CF" },
      { name: "Light grey",  hex: "#D1D5DB" },
      { name: "Mid grey",    hex: "#6B7280" },
      { name: "Orange",      hex: "#F28C1E" },
      { name: "Mid blue",    hex: "#2F6FDE" },
      { name: "Dark purple", hex: "#5B21B6" },
      { name: "Navy",        hex: "#111B3D" }
    ];
    var BACKGROUNDS = {
      light: ["#FFEDB3", "#FCCCDB"],
      dark:  ["#1E3A8A", "#5B21B6"]
    };
    var START_INDEX = 0;          /* Pale yellow: Hard to read on the light poster */
    var NAVY = 7;                 /* the challenge starts with Navy on the dark poster */

    var area = document.getElementById("cc-area");
    var poster = document.getElementById("cc-poster");
    var swatchRow = document.getElementById("cc-swatches");
    var statusEl = document.getElementById("ex-status");

    var selected = START_INDEX;
    var mode = "light";
    var buttons = [];
    var easyFound = {};           /* Easy colours chosen on the light poster */

    poster.innerHTML = '<svg class="cc-svg" viewBox="0 0 400 300" width="100%" role="img">' +
      '<defs><linearGradient id="cc-grad" x1="0" y1="0" x2="0" y2="1">' +
      '<stop class="cc-stop0" offset="0"/><stop class="cc-stop1" offset="1"/></linearGradient></defs>' +
      '<rect width="400" height="300" fill="url(#cc-grad)"/>' +
      '<g class="cc-words" text-anchor="middle">' +
      '<text class="cc-title" x="200" y="130" font-size="42">CHRISTMAS FAIR</text>' +
      '<text x="200" y="192" font-size="26">Friday 18 December</text>' +
      '<text x="200" y="232" font-size="26">Lunchtime</text>' +
      '</g></svg>';
    var svg = poster.querySelector("svg");

    function luminance(hex) {
      var c = [1, 3, 5].map(function (i) {
        var v = parseInt(hex.substr(i, 2), 16) / 255;
        return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
      });
      return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
    }
    function contrast(a, b) {
      var la = luminance(a), lb = luminance(b);
      return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
    }
    function band(i, m) {
      var bg = BACKGROUNDS[m || mode];
      var r = Math.min(contrast(COLOURS[i].hex, bg[0]), contrast(COLOURS[i].hex, bg[1]));
      return r < 3 ? "hard" : (r < 4.5 ? "ok" : "good");
    }
    var WORDS = { hard: "Hard to read", ok: "OK", good: "Easy to read" };

    function foundCount() { return Object.keys(easyFound).length; }

    function render() {
      var bg = BACKGROUNDS[mode];
      svg.querySelector(".cc-stop0").setAttribute("stop-color", bg[0]);
      svg.querySelector(".cc-stop1").setAttribute("stop-color", bg[1]);
      svg.querySelector(".cc-words").setAttribute("fill", COLOURS[selected].hex);

      var b = band(selected);
      var text = WORDS[b];
      /* On the light poster, say how many Easy colours have been found. */
      if (mode === "light" && b === "good") text += ". " + foundCount() + " of 2 found.";
      Explorer.status(text, b);

      svg.setAttribute("aria-label", "Poster. Christmas Fair. Friday 18 December. Lunchtime. " +
        COLOURS[selected].name + " text: " + WORDS[b] + ".");
      buttons.forEach(function (btn, i) { btn.setAttribute("aria-pressed", i === selected ? "true" : "false"); });
    }

    function choose(i) {
      selected = i;
      if (mode === "light" && band(i) === "good") easyFound[i] = true;
      render();
      Explorer.answer();
    }

    COLOURS.forEach(function (c, i) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "cc-swatch";
      b.style.background = c.hex;
      b.setAttribute("aria-label", c.name);
      b.title = c.name;
      b.addEventListener("click", function () { choose(i); });
      b.addEventListener("keydown", function (e) {
        var to = -1;
        if (e.key === "ArrowRight" || e.key === "ArrowDown") to = (i + 1) % COLOURS.length;
        if (e.key === "ArrowLeft" || e.key === "ArrowUp") to = (i + COLOURS.length - 1) % COLOURS.length;
        if (to >= 0) { e.preventDefault(); buttons[to].focus(); }
      });
      swatchRow.appendChild(b);
      buttons.push(b);
    });

    /* The title is squeezed only if the font on this device makes it too wide. */
    function fitTitle() {
      var t = svg.querySelector(".cc-title");
      t.removeAttribute("textLength");
      t.removeAttribute("lengthAdjust");
      if (t.getComputedTextLength() > 352) {
        t.setAttribute("textLength", "352");
        t.setAttribute("lengthAdjust", "spacingAndGlyphs");
      }
    }

    /* The poster takes the space left above the swatches and the status line. */
    function layout() {
      if (!area.clientHeight) return;
      var cs = getComputedStyle(area);
      var gap = parseFloat(cs.rowGap) || 10;
      var availW = area.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 4;
      var availH = area.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom)
                   - swatchRow.offsetHeight - statusEl.offsetHeight - gap * 2 - 4;
      var h = Math.max(150, Math.min(420, Math.floor(availH - 4)));
      var w = Math.round(h * 4 / 3);
      if (w > availW) { w = Math.floor(availW); h = Math.round(w * 3 / 4); }
      poster.style.width = (w + 4) + "px";
    }

    Explorer.setup({
      keyword: { word: "Contrast", meaning: "How different the text colour is from the background." },
      bridge: { title: "Later, in Canva", img: "shared/canva/text-toolbar.png", imgW: 1720, imgH: 88, crop: [0, 620], focus: [452, 70], alt: "Canva toolbar with the text colour button ringed", text: "Click the text. Click the A. Pick a colour." },
      pulse: "#cc-swatches",
      success: function () { return mode === "light" && foundCount() >= 2; },
      successText: "Easy to read. 2 of 2 found.",
      hint: "Try a dark colour.",
      hintAfter: 60,
      onShow: function () { layout(); render(); },
      onReset: function () {
        selected = START_INDEX;
        mode = "light";
        easyFound = {};
        render();
      },
      challenge: {
        text: "The background is now dark. Find a colour that is Easy to read.",
        /* Switch to the dark background straight away, with Navy text,
           so the change is easy to see. */
        start: function () { mode = "dark"; selected = NAVY; render(); },
        success: function () { return mode === "dark" && band(selected) === "good"; },
        successText: "Easy to read on the dark background.",
        hint: "Try a light colour.",
        pulse: "#cc-swatches"
      }
    });

    layout();
    render();
    fitTitle();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { fitTitle(); layout(); });
    if (window.ResizeObserver) new ResizeObserver(layout).observe(area);
    window.addEventListener("resize", layout);
  })();
</script>
</body>
</html>
