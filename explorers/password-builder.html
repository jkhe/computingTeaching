<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build a password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/explorer.css?v=3">
<style>
  /* Page-specific styles only. */
  .pw-stage { width: min(1240px, 100%); display: flex; flex-direction: column; gap: 14px; flex-shrink: 0; }

  /* The buttons that add a piece: directly above the password they change. */
  .pw-buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .pw-buttons .ex-btn { padding: 8px 13px; }
  .pw-buttons .ex-btn::before { content: "+ "; color: var(--accent); }
  .pw-buttons .ex-btn[aria-disabled="true"] { opacity: 0.4; cursor: default; transform: none; background: var(--panel); border-color: var(--line-strong); }

  /* The password being built */
  .pw-box {
    border: 2px solid var(--line-strong);
    border-radius: 14px;
    background: var(--panel);
    padding: 10px 14px;
  }
  .pw-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-height: 76px; }
  .pw-empty { flex: 1; text-align: center; font-size: 22px; font-weight: 800; color: var(--muted); letter-spacing: 4px; }
  .pw-chip {
    position: relative;
    display: flex; flex-direction: column; align-items: center;
    font-family: var(--font);
    border: 2px solid; border-radius: 12px; padding: 2px 30px 4px 12px;
    cursor: pointer;
    animation: ex-fade 0.25s ease;
  }
  .pw-chip.old { animation: none; }
  /* The cross shows a piece can be taken out again. */
  .pw-chip::after {
    content: "\00D7"; position: absolute; right: 8px; top: 4px;
    font-size: 20px; font-weight: 800; line-height: 1; opacity: 0.55;
  }
  .pw-chip:hover::after, .pw-chip:focus-visible::after { opacity: 1; }
  .pw-chip .pw-txt { font-size: 32px; font-weight: 800; letter-spacing: 2px; line-height: 1.25; color: #1F2937; }
  .pw-chip .pw-kind { font-size: 13px; font-weight: 800; line-height: 1.2; }
  .pw-chip.personal { background: var(--bad-soft); border-color: var(--bad); }
  .pw-chip.personal .pw-kind, .pw-chip.personal::after { color: var(--bad); }
  .pw-chip.pattern { background: var(--ok-soft); border-color: var(--ok); }
  .pw-chip.pattern .pw-kind, .pw-chip.pattern::after { color: var(--ok); }
  .pw-chip.word { background: var(--good-soft); border-color: var(--good); }
  .pw-chip.word .pw-kind, .pw-chip.word::after { color: var(--good); }
  .pw-chip.letters { background: var(--accent-soft); border-color: var(--accent); }
  .pw-chip.letters .pw-kind, .pw-chip.letters::after { color: var(--accent); }
  .pw-chip.nudge { box-shadow: 0 0 0 4px var(--bad); }
  .pw-flash { animation: pw-pop 0.5s ease; display: inline-block; }
  @keyframes pw-pop { 0% { transform: scale(1.6); color: var(--accent); } 100% { transform: none; } }

  /* The result: time to crack, with a meter, and (in the challenge) easy to remember */
  .pw-result { display: flex; align-items: center; justify-content: center; gap: 28px; }
  .pw-crack { display: flex; flex-direction: column; gap: 6px; width: min(560px, 60%); }
  .pw-crack-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .pw-label { font-size: 15px; font-weight: 800; color: var(--muted); white-space: nowrap; }
  .pw-time { font-size: 36px; font-weight: 800; line-height: 1.1; color: var(--muted); text-align: right; }
  .pw-time.bad { color: var(--bad); }
  .pw-time.ok { color: var(--ok); }
  .pw-time.good { color: var(--good); }
  .pw-meter { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
  .pw-meter span { height: 16px; border-radius: 4px; background: var(--line); transition: background 0.25s; }
  .pw-meter span.on.bad { background: var(--bad); }
  .pw-meter span.on.ok { background: #D97706; }
  .pw-meter span.on.good { background: var(--good); }
  .pw-easy { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  .pw-easy[hidden] { display: none; }
  .pw-easy .ex-tag { font-size: 22px; padding: 2px 16px; }

  /* ----- Start screen demo: the pointer presses a button, a piece appears ----- */
  .pw-d-box { position: absolute; left: 30px; right: 30px; top: 22px; height: 52px; border: 2px solid var(--line-strong); border-radius: 10px; }
  .pw-d-chip { position: absolute; top: 8px; height: 32px; border-radius: 8px; border: 2px solid var(--good); background: var(--good-soft); }
  .pw-d-chip.a { left: 10px; width: 70px; }
  .pw-d-chip.b { left: 88px; width: 78px; opacity: 0; animation: pw-d-chip 3.4s ease infinite; }
  .pw-d-btn { position: absolute; left: 88px; top: 104px; width: 144px; height: 40px; border-radius: 10px; border: 2px solid var(--line-strong); background: #fff; font-size: 16px; font-weight: 800; line-height: 36px; text-align: center; color: var(--text); animation: pw-d-btn 3.4s ease infinite; }
  .pw-d-btn::before { content: "+ "; color: var(--accent); }
  .pw-d-ptr { position: absolute; left: 0; top: 0; width: 30px; height: 30px; animation: pw-d-ptr 3.4s ease-in-out infinite; }
  .pw-d-ptr .ex-ghost { left: 0; top: 0; }
  .pw-d-arrow { display: none; }
  @keyframes pw-d-ptr { 0% { transform: translate(250px, 150px); } 35%, 100% { transform: translate(160px, 120px); } }
  @keyframes pw-d-btn { 0%, 36% { background: #fff; } 40%, 48% { background: var(--accent-soft); border-color: var(--accent); } 52%, 100% { background: #fff; } }
  @keyframes pw-d-chip { 0%, 40% { opacity: 0; transform: translateY(4px); } 50%, 90% { opacity: 1; transform: none; } 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .pw-d-ptr, .pw-d-btn, .pw-d-chip.b { animation: none !important; }
    .pw-d-ptr { transform: translate(160px, 120px); }
    .pw-d-chip.b { opacity: 1; }
    .pw-d-arrow { display: block; position: absolute; left: 126px; top: 80px; width: 4px; height: 20px; background: var(--accent); }
    .pw-d-arrow::before { content: ""; position: absolute; left: -8px; top: -12px; border: 10px solid transparent; border-top: 0; border-bottom: 14px solid var(--accent); }
  }

  @media (max-width: 1100px), (max-height: 620px) {
    .pw-stage { gap: 10px; }
    .pw-buttons { gap: 6px; }
    .pw-buttons .ex-btn { padding: 6px 10px; font-size: 15px; }
    .pw-chips { min-height: 64px; }
    .pw-chip .pw-txt { font-size: 26px; letter-spacing: 1px; }
    .pw-chip .pw-kind { font-size: 12px; }
    .pw-time { font-size: 30px; }
    .pw-easy .ex-tag { font-size: 19px; }
  }
</style>
</head>
<body class="unit-1 ex-v2">

<!-- SCREEN 1: Start -->
<section class="ex-screen ex-start" id="ex-start">
  <h1>Build a password</h1>
  <p class="ex-why">Strong passwords keep your accounts safe.</p>
  <div class="ex-demo" aria-hidden="true">
    <span class="pw-d-box"><span class="pw-d-chip a"></span><span class="pw-d-chip b"></span></span>
    <span class="pw-d-arrow"></span>
    <span class="pw-d-btn">Random word</span>
    <span class="pw-d-ptr"><svg class="ex-ghost" viewBox="0 0 24 24"><path d="M5 2l14 11h-7.2l4 7.6-3 1.6-4-7.7L5 19z"/></svg></span>
  </div>
  <p class="ex-how">Add pieces.</p>
  <button type="button" class="ex-btn primary big" id="ex-go">Start</button>
</section>

<!-- SCREEN 2: Explore -->
<section class="ex-screen" id="ex-explore" hidden>
  <div class="ex-top">
    <span class="ex-steps" id="ex-steps" aria-hidden="true"><i></i><i></i></span>
    <p class="ex-instruction" id="ex-instruction">Make a password that takes years to crack, with nothing personal.</p>
    <button type="button" class="ex-quiet" id="ex-reset">Start again</button>
  </div>
  <div class="ex-area">
    <div class="pw-stage">
      <div class="pw-buttons" id="pw-buttons" role="group" aria-label="Add a piece">
        <button type="button" class="ex-btn" data-piece="pet">Pet's name</button>
        <button type="button" class="ex-btn" data-piece="team">Football team</button>
        <button type="button" class="ex-btn" data-piece="year">Birth year</button>
        <button type="button" class="ex-btn" data-piece="num" aria-label="1 2 3">123</button>
        <button type="button" class="ex-btn" data-piece="bang" aria-label="Exclamation mark">!</button>
        <button type="button" class="ex-btn" data-piece="cap" aria-disabled="true">Capital letter</button>
        <button type="button" class="ex-btn" data-piece="word">Random word</button>
        <button type="button" class="ex-btn" data-piece="letters">Random letters and numbers</button>
      </div>
      <div class="pw-box" aria-label="Your password">
        <div class="pw-chips" id="pw-chips"></div>
      </div>
      <div class="pw-result">
        <div class="pw-crack">
          <div class="pw-crack-top">
            <span class="pw-label">Time to crack (estimate)</span>
            <span class="pw-time" id="pw-time">&nbsp;</span>
          </div>
          <div class="pw-meter" id="pw-meter" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>
        <div class="pw-easy" id="pw-easy-wrap" hidden>
          <span class="pw-label">Easy to remember?</span>
          <span class="ex-tag" id="pw-easy">&nbsp;</span>
        </div>
      </div>
    </div>
    <p class="ex-status" id="ex-status" role="status"></p>
  </div>
</section>

<script src="shared/explorer.js?v=3"></script>
<script>
  (function () {
    "use strict";

    /* ------------------------------------------------------------------
       CRACK-TIME MODEL (the only place the estimates live)

       1. Guessing strength in bits = the sum of these per-piece values:
            personal piece (pet's name, football team, birth year)  8 bits each
              (attackers try personal details and common words first)
            "123"                                                    2 bits
            "!"                                                      3 bits
            capital first letter                                     1 bit
            random word (picked from a list of about 7,776 words)   12.9 bits
            4 random characters (4 x 6.5)                           26 bits
       2. Guesses needed = 2 ^ bits.
       3. Time = guesses needed / GUESSES_PER_SECOND.

       ASSUMPTION: GUESSES_PER_SECOND = 10,000. This is about what one
       attacker's computer manages against a stolen password that the
       website stored carefully (a slow hash). Against badly stored
       passwords an attacker can guess far faster (billions a second); at
       10,000,000,000 a second three random words (38.7 bits) would fall in
       under a minute, so the "Years" result on this page depends on this
       assumption. The page says "estimate" next to the result.

       The result is shown only as a band in words, never a precise number.
       ------------------------------------------------------------------ */
    var GUESSES_PER_SECOND = 10000;
    var BITS = { personal: 8, num: 2, bang: 3, cap: 1, word: 12.9, letters: 26 };

    var MIN = 60, HOUR = 3600, DAY = 86400, MONTH = 30 * DAY, YEAR = 365.25 * DAY;
    /* Upper limit (seconds) for each band, in order. */
    var BANDS = [
      { max: 1,              text: "Instantly",                 cls: "bad" },
      { max: MIN,            text: "Seconds",                   cls: "bad" },
      { max: HOUR,           text: "Minutes",                   cls: "bad" },
      { max: DAY,            text: "Hours",                     cls: "ok" },
      { max: MONTH,          text: "Days",                      cls: "ok" },
      { max: YEAR,           text: "Months",                    cls: "ok" },
      { max: 100 * YEAR,     text: "Years",                     cls: "good" },
      { max: 1000 * YEAR,    text: "Hundreds of years",         cls: "good" },
      { max: 1000000 * YEAR, text: "Thousands of years",        cls: "good" },
      { max: Infinity,       text: "More than a million years", cls: "good" }
    ];
    var YEARS_BAND = 6;

    var WORDS = ["kettle", "cloud", "marble", "lantern", "pickle", "harbour", "velvet", "gravel"];
    var LETTERS = ["q7Rx", "m2Vk", "t9Wd", "h4Zp", "b6Ny", "j3Qf"];
    var MAX_PIECES = 6;

    var FIXED = {
      pet:  { text: "buster", kind: "personal", label: "personal" },
      team: { text: "rovers", kind: "personal", label: "personal" },
      year: { text: "2012",   kind: "personal", label: "personal" },
      num:  { text: "123",    kind: "pattern",  label: "pattern", bits: BITS.num },
      bang: { text: "!",      kind: "pattern",  label: "symbol",  bits: BITS.bang }
    };

    var pieces, cap, wordIndex, lettersIndex;

    var chipsEl = document.getElementById("pw-chips");
    var timeEl = document.getElementById("pw-time");
    var meterEls = document.getElementById("pw-meter").children;
    var easyWrap = document.getElementById("pw-easy-wrap");
    var easyEl = document.getElementById("pw-easy");
    var buttons = document.querySelectorAll("#pw-buttons .ex-btn");

    function start() {
      pieces = []; cap = false; wordIndex = 0; lettersIndex = 0;
    }

    function hasLetter() {
      return pieces.some(function (p) { return /[a-z]/i.test(p.text); });
    }
    function isUsed(id) {
      return pieces.some(function (p) { return p.id === id; });
    }

    function canUse(id) {
      if (id === "cap") return !cap && hasLetter();
      if (pieces.length >= MAX_PIECES) return false;
      if (FIXED[id]) return !isUsed(id);
      return true;
    }

    function add(id) {
      if (!canUse(id)) return false;
      if (id === "cap") { cap = true; return true; }
      if (FIXED[id]) {
        var f = FIXED[id];
        pieces.push({ id: id, text: f.text, kind: f.kind, label: f.label, bits: f.bits || BITS.personal });
      } else if (id === "word") {
        pieces.push({ id: id, text: WORDS[wordIndex % WORDS.length], kind: "word", label: "random word", bits: BITS.word });
        wordIndex += 1;
      } else if (id === "letters") {
        pieces.push({ id: id, text: LETTERS[lettersIndex % LETTERS.length], kind: "letters", label: "random letters", bits: BITS.letters });
        lettersIndex += 1;
      }
      return true;
    }

    function bandFor(seconds) {
      for (var i = 0; i < BANDS.length; i++) if (seconds < BANDS[i].max) return i;
      return BANDS.length - 1;
    }

    function measure() {
      var bits = cap ? BITS.cap : 0;
      pieces.forEach(function (p) { bits += p.bits; });
      return {
        band: pieces.length ? bandFor(Math.pow(2, bits) / GUESSES_PER_SECOND) : -1,
        personal: pieces.some(function (p) { return p.kind === "personal"; }),
        hard: pieces.some(function (p) { return p.kind === "letters"; })
      };
    }

    function strong() { var m = measure(); return m.band >= YEARS_BAND && !m.personal; }
    function strongAndEasy() { var m = measure(); return m.band >= YEARS_BAND && !m.personal && !m.hard && pieces.length > 0; }

    /* newIndex: the chip that was just added (it fades in). flashCap: the
       capital letter was just added (it pops). */
    function render(newIndex, flashCap, focusIndex) {
      var capDone = !cap;
      chipsEl.textContent = "";

      if (!pieces.length) {
        var empty = document.createElement("span");
        empty.className = "pw-empty";
        empty.textContent = "_ _ _ _ _ _";
        empty.setAttribute("aria-label", "Empty");
        chipsEl.appendChild(empty);
      }

      pieces.forEach(function (p, index) {
        var chip = document.createElement("button");
        chip.type = "button";
        chip.className = "pw-chip " + p.kind + (index === newIndex ? "" : " old");
        chip.setAttribute("data-index", index);
        var txt = document.createElement("span");
        txt.className = "pw-txt";
        var m = capDone ? null : /[a-z]/i.exec(p.text);
        var shown = p.text;
        if (m) {
          capDone = true;
          var big = document.createElement("span");
          big.textContent = p.text.charAt(m.index).toUpperCase();
          if (flashCap) big.className = "pw-flash";
          txt.appendChild(document.createTextNode(p.text.slice(0, m.index)));
          txt.appendChild(big);
          txt.appendChild(document.createTextNode(p.text.slice(m.index + 1)));
          shown = p.text.slice(0, m.index) + big.textContent + p.text.slice(m.index + 1);
        } else {
          txt.textContent = p.text;
        }
        var kind = document.createElement("span");
        kind.className = "pw-kind";
        kind.textContent = p.label;
        chip.appendChild(txt);
        chip.appendChild(kind);
        chip.setAttribute("aria-label", shown + ", " + p.label + ". Take this piece out.");
        chipsEl.appendChild(chip);
      });

      var r = measure(), i;
      if (r.band < 0) {
        timeEl.textContent = " ";
        timeEl.className = "pw-time";
        for (i = 0; i < meterEls.length; i++) meterEls[i].className = "";
      } else {
        timeEl.textContent = BANDS[r.band].text;
        timeEl.className = "pw-time " + BANDS[r.band].cls;
        for (i = 0; i < meterEls.length; i++) {
          meterEls[i].className = i <= r.band ? "on " + BANDS[r.band].cls : "";
        }
      }

      if (!pieces.length) { easyEl.textContent = " "; easyEl.className = "ex-tag"; }
      else if (r.hard) { easyEl.textContent = "No"; easyEl.className = "ex-tag ok"; }
      else { easyEl.textContent = "Yes"; easyEl.className = "ex-tag good"; }

      for (i = 0; i < buttons.length; i++) {
        buttons[i].setAttribute("aria-disabled", canUse(buttons[i].getAttribute("data-piece")) ? "false" : "true");
      }

      Explorer.status(statusText(r));

      if (typeof focusIndex === "number") {
        var target = chipsEl.querySelector('[data-index="' + Math.min(focusIndex, pieces.length - 1) + '"]');
        if (target) target.focus({ preventScroll: true });
        else if (buttons[0]) buttons[0].focus({ preventScroll: true });
      }
    }

    /* The one feedback line. Guidance only, never "wrong". */
    function statusText(r) {
      if (!pieces.length) return "";
      if (r.personal) return "Click a red piece to take it out.";
      if (Explorer.step() === 2 && r.hard) return "Random letters and numbers are hard to remember.";
      if (pieces.length >= MAX_PIECES) return "Click a piece to take it out.";
      return "";
    }

    for (var k = 0; k < buttons.length; k++) {
      buttons[k].addEventListener("click", function () {
        var id = this.getAttribute("data-piece");
        if (!add(id)) return;
        render(id === "cap" ? -1 : pieces.length - 1, id === "cap");
        Explorer.used();          // stops the pulse and checks for success
      });
    }

    /* Clicking a piece in the password takes it out, so nobody has to start over. */
    chipsEl.addEventListener("click", function (e) {
      var chip = e.target.closest ? e.target.closest(".pw-chip") : null;
      if (!chip) return;
      var i = Number(chip.getAttribute("data-index"));
      pieces.splice(i, 1);
      if (!hasLetter()) cap = false;
      render(-1, false, e.detail === 0 ? i : undefined);
      Explorer.used();
    });

    function nudgePersonal() {
      var red = chipsEl.querySelectorAll(".pw-chip.personal");
      for (var i = 0; i < red.length; i++) red[i].classList.add("nudge");
    }

    Explorer.setup({
      keyword: { word: "Strong password", meaning: "A password that is very hard to guess." },
      /* Step 1: years or longer, and nothing personal. */
      pulse: "#pw-buttons .ex-btn:not([aria-disabled='true'])",
      success: strong,
      successText: "Years to crack, and nothing personal.",
      hint: function () {
        if (measure().personal) { nudgePersonal(); return "Click a red piece to take it out."; }
        return "Try adding random words.";
      },
      hintAfter: 60,
      onReset: function () {
        start();
        easyWrap.hidden = true;
        render(-1, false);
      },
      /* Step 2: start empty; years or longer, nothing personal, easy to remember. */
      challenge: {
        text: "Now make one that is also easy to remember.",
        start: function () {
          start();
          easyWrap.hidden = false;
          render(-1, false);
        },
        success: strongAndEasy,
        successText: "Strong and easy to remember.",
        hint: "Random words are easy to remember.",
        pulse: "#pw-buttons .ex-btn:not([aria-disabled='true'])"
      }
    });

    start();
    render(-1, false);
  })();
</script>
</body>
</html>
