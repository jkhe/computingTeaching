<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Line it up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/explorer.css?v=6">
<style>
  /* Page-specific styles only. */
  body { --pulse: #7C3AED; --hint: #6D28D9; }   /* pulse and hints match the purple guide line */

  /* The poster is drawn at a fixed size (640 x 300) and scaled in JS to fit. */
  .ap-wrap {
    flex-shrink: 0;
    position: relative;
    border: 2px solid var(--line-strong);
    border-radius: 8px;
    overflow: hidden;
    box-sizing: content-box;
  }
  .ap-poster {
    position: absolute;
    left: 0;
    top: 0;
    width: 640px;
    height: 300px;
    transform-origin: 0 0;
    background: #FEF3C7;
    color: #1F2937;
    -webkit-user-select: none;
    user-select: none;
  }
  .ap-layer { position: absolute; inset: 0; }
  .ap-layer[hidden] { display: none; }

  /* ----- Poster 1: blocks to drag ----- */
  #ap-align { cursor: grab; touch-action: none; }
  #ap-align.dragging { cursor: grabbing; }
  .ap-block {
    position: absolute;
    left: 0;
    white-space: nowrap;
    font-weight: 800;
    font-size: 25px;
    line-height: 30px;
    padding: 7px 10px;
    border: 2px dashed rgba(31, 41, 55, 0.4);
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.45);
    cursor: grab;
    touch-action: none;
    will-change: transform;
  }
  .ap-block.title { font-size: 46px; line-height: 50px; padding: 4px 10px; letter-spacing: 1px; }
  .ap-block.active {
    border-style: solid;
    border-color: #7C3AED;
    background: #fff;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.18);
    cursor: grabbing;
    z-index: 3;
  }
  .ap-block.on-guide { border-left: 2px solid #7C3AED; }
  .ap-block:focus-visible { outline: 3px solid #7C3AED; outline-offset: 2px; z-index: 3; }
  /* The block named in a hint. */
  .ap-block.nudge { border-color: #7C3AED; background: #fff; }

  /* The guide line: shown when left edges line up. */
  .ap-guide {
    position: absolute;
    width: 0;
    border-left: 3px dashed #7C3AED;
    margin-left: -1px;
    pointer-events: none;
    z-index: 2;
    display: none;
  }
  .ap-guide.show { display: block; }
  .ap-guide.all { border-left-style: solid; }

  /* ----- Poster 2: one wall of text, split by pressing Enter ----- */
  #ap-para { padding: 22px 28px; cursor: text; }
  .ap-text { font-weight: 800; font-size: 23px; line-height: 1.3; border-radius: 6px; }
  .ap-para-block { break-inside: avoid; }
  .ap-para-block.new { animation: ex-fade 0.25s ease; }
  /* Every word can be clicked: Enter is pressed just after it. */
  .ap-word { border-radius: 4px; cursor: pointer; }
  .ap-word.last { cursor: text; }
  .ap-word:not(.last):hover { background: #EDE9FE; box-shadow: 0 0 0 2px #EDE9FE; }
  .ap-word:focus-visible { outline: 3px solid #7C3AED; outline-offset: 1px; background: #EDE9FE; }
  /* The gap a paragraph break makes. Clicking it joins the text back. */
  .ap-gapbar { height: 0.7em; cursor: pointer; }
  /* The Enter key, drawn where Enter was pressed. Clicking it joins the text back. */
  .ap-key {
    display: inline-block;
    width: 1.8em;
    height: 1.35em;
    margin-left: 0.25em;
    vertical-align: -0.28em;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    border-radius: 5px;
    animation: ap-key-pop 0.35s ease-out;
  }
  .ap-key svg { display: block; width: 100%; height: 100%; }
  .ap-key:hover svg rect, .ap-key:focus-visible svg rect { fill: #EDE9FE; }
  .ap-key:focus-visible { outline: 3px solid #7C3AED; outline-offset: 2px; }
  /* A break in the middle of an idea: a soft ring so it is easy to find. */
  .ap-key.split { animation: ap-key-pop 0.35s ease-out, ap-ring 1.8s ease-out 0.35s infinite; }
  @keyframes ap-key-pop { from { transform: scale(1.6); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes ap-ring {
    0%   { box-shadow: 0 0 0 0 #7C3AED; }
    70%  { box-shadow: 0 0 0 8px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }

  /* ----- Start screen demo: a ghost pointer drags a block to the line ----- */
  .ex-v2 .ap-demo { background: #FEF3C7; }
  .ap-d-bar { position: absolute; left: 44px; border-radius: 4px; background: #1F2937; opacity: 0.8; }
  .ap-d-bar.t { top: 24px; width: 150px; height: 30px; }
  .ap-d-bar.a { top: 74px; width: 190px; height: 20px; }
  .ap-d-move { position: absolute; left: 44px; top: 114px; width: 130px; height: 20px; transform: translateX(110px); animation: ap-d-move 3.4s ease-in-out infinite; }
  .ap-d-move .ap-d-bar { left: 0; top: 0; width: 130px; height: 20px; box-shadow: 0 0 0 3px #fff, 0 0 0 5px #7C3AED; }
  .ap-d-move .ex-ghost { left: 56px; top: 6px; }
  .ap-d-line { position: absolute; left: 43px; top: 10px; bottom: 10px; border-left: 3px dashed #7C3AED; opacity: 0; animation: ap-d-line 3.4s linear infinite; }
  .ap-d-arrow { display: none; }
  @keyframes ap-d-move {
    0%, 18%  { transform: translateX(110px); opacity: 1; }
    55%, 86% { transform: translateX(0); opacity: 1; }
    92%      { transform: translateX(0); opacity: 0; }
    93%      { transform: translateX(110px); opacity: 0; }
    100%     { transform: translateX(110px); opacity: 1; }
  }
  @keyframes ap-d-line { 0%, 52% { opacity: 0; } 56%, 86% { opacity: 1; } 92%, 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    /* A still frame: the block, the line it is going to, and an arrow. */
    .ap-d-move, .ap-d-line { animation: none !important; }
    .ap-d-line { opacity: 1; }
    .ap-d-arrow { display: block; position: absolute; left: 58px; top: 122px; width: 84px; height: 4px; background: #7C3AED; }
    .ap-d-arrow::before { content: ""; position: absolute; left: -6px; top: -8px; border: 10px solid transparent; border-left: 0; border-right: 14px solid #7C3AED; }
    .ap-key, .ap-key.split { animation: none !important; }
    .ap-key.split { box-shadow: 0 0 0 3px #7C3AED; }
  }
</style>
</head>
<body class="unit-2 ex-v2">

<!-- SCREEN 1: Start -->
<section class="ex-screen ex-start" id="ex-start">
  <h1>Line it up</h1>
  <p class="ex-why">Lined-up posters are quicker to read.</p>
  <div class="ex-demo ap-demo" aria-hidden="true">
    <span class="ap-d-line"></span>
    <span class="ap-d-bar t"></span>
    <span class="ap-d-bar a"></span>
    <span class="ap-d-arrow"></span>
    <span class="ap-d-move">
      <span class="ap-d-bar"></span>
      <svg class="ex-ghost" viewBox="0 0 24 24"><path d="M5 2l14 11h-7.2l4 7.6-3 1.6-4-7.7L5 19z"/></svg>
    </span>
  </div>
  <p class="ex-how">Drag a block.</p>
  <button type="button" class="ex-btn primary big" id="ex-go">Start</button>
</section>

<!-- SCREEN 2: Explore -->
<section class="ex-screen" id="ex-explore" hidden>
  <div class="ex-top">
    <span class="ex-steps" id="ex-steps" aria-hidden="true"><i></i><i></i></span>
    <p class="ex-instruction" id="ex-instruction">Line up all 4 blocks on one edge.</p>
    <button type="button" class="ex-quiet" id="ex-reset">Start again</button>
  </div>
  <div class="ex-area" id="ap-area">
    <div class="ap-wrap" id="ap-wrap">
      <div class="ap-poster" id="ap-poster">
        <div class="ap-layer" id="ap-align" role="group" aria-label="Poster. Four blocks you can move left and right.">
          <div class="ap-guide"></div>
          <div class="ap-guide"></div>
        </div>
        <div class="ap-layer" id="ap-para" hidden role="group" aria-label="Poster. One block of text you can split.">
          <div class="ap-text" id="ap-text"></div>
        </div>
      </div>
    </div>
    <p class="ex-status" id="ex-status" role="status"></p>
  </div>
</section>

<script src="shared/explorer.js?v=6"></script>
<script>
  (function () {
    "use strict";

    /* The poster is always laid out at 640 x 300 and then scaled to fit the
       stage, so every position below is in poster units.
       SNAP: a moving block jumps to another block's left edge when it comes
       within 6 units of it. HOLD: once snapped, it stays snapped until the
       pointer has moved 10 units away, which makes it easy to let go on the
       line with a trackpad. Arrow keys move a block 8 units. */
    var W = 640, H = 300, EDGE = 12, SNAP = 6, HOLD = 10, KEY_STEP = 8;
    var GUIDE = "#7C3AED";

    var BLOCKS = [
      { text: "CHESS CLUB",                        title: true,  top: 20,  start: 152 },
      { text: "When: Tuesday lunchtime",           title: false, top: 102, start: 40 },
      { text: "Where: Room 4",                     title: false, top: 164, start: 168 },
      { text: "Who: Everyone, beginners welcome",  title: false, top: 226, start: 96 }
    ];
    /* Each block can be grabbed anywhere in its own row of the poster. */
    var ROW_EDGES = [0, 96, 158, 220, H];

    var WALL = "Chess Club meets every Tuesday at lunchtime. It is in Room 4. Everyone is welcome, including beginners. We have snacks.".split(" ");

    /* The places where one idea ends and the next begins (word numbers). */
    var IDEA_ENDS = [6, 11, 16];   // after "lunchtime.", "4." and "beginners."
    var NOTE_SPLIT = "That splits an idea in half. Click it to join it back.";

    var area = document.getElementById("ap-area");
    var statusEl = document.getElementById("ex-status");
    var wrap = document.getElementById("ap-wrap");
    var poster = document.getElementById("ap-poster");
    var alignLayer = document.getElementById("ap-align");
    var paraLayer = document.getElementById("ap-para");
    var textEl = document.getElementById("ap-text");
    var guides = alignLayer.querySelectorAll(".ap-guide");   // one line for each lined-up group
    var NOTE_BLOCKED = "This block will not fit there. Try a different edge.";

    var mode = "align";           // "align" or "para"
    var scale = 1;
    var els = [];                 // block elements
    var lefts = [];               // current left edge of each block
    var widths = [];              // measured width of each block
    var drag = null;              // { i, startX, startLeft, held }
    var blocked = false;          // the last move was stopped by the poster edge
    var touched = false;          // the pupil has moved a block since the start
    var breaks = [];              // breaks[i] true = paragraph break after word i

    /* ---------- Poster 1: line up the blocks ---------- */

    BLOCKS.forEach(function (b, i) {
      var el = document.createElement("div");
      el.className = "ap-block" + (b.title ? " title" : "");
      el.textContent = b.text;
      el.style.top = b.top + "px";
      el.setAttribute("role", "button");
      el.setAttribute("tabindex", "0");
      el.setAttribute("aria-label", "Block: " + b.text + ". Press the left or right arrow key to move it.");
      el.addEventListener("keydown", function (e) { onKey(e, i); });
      alignLayer.appendChild(el);
      els.push(el);
      lefts.push(b.start);
    });

    function maxLeft(i) { return Math.max(EDGE, W - widths[i] - EDGE); }
    function clamp(i, x) { return Math.max(EDGE, Math.min(maxLeft(i), Math.round(x))); }

    /* Start positions. If this device's font makes the widest block wider,
       pull any start edge back (on the 8-unit grid) so every block can
       still reach every other block's edge. */
    function startLefts() {
      var limit = Infinity;
      BLOCKS.forEach(function (b, i) { limit = Math.min(limit, maxLeft(i)); });
      limit = Math.floor(limit / KEY_STEP) * KEY_STEP;
      var out = BLOCKS.map(function (b) { return b.start; });
      out.forEach(function (x, i) {
        if (x <= limit) return;
        x = limit;
        while (out.indexOf(x) >= 0 && x - KEY_STEP >= EDGE) x -= KEY_STEP;   /* no two blocks start lined up */
        out[i] = x;
      });
      return out;
    }

    function measure() {
      if (alignLayer.hidden || !els[0].offsetWidth) return;   /* not on screen yet */
      els.forEach(function (el, i) { widths[i] = el.offsetWidth; });
      if (!touched) lefts = startLefts();
      lefts = lefts.map(function (x, i) { return clamp(i, x); });
    }

    /* The nearest other left edge within `range` of x, or null. */
    function nearestEdge(i, x, range) {
      var best = null, bestD = range + 0.001;
      lefts.forEach(function (other, j) {
        if (j === i) return;
        if (other < EDGE || other > maxLeft(i)) return;
        var d = Math.abs(other - x);
        if (d < bestD) { bestD = d; best = other; }
      });
      return best;
    }

    /* Every group of two or more blocks that share a left edge. */
    function linedUpGroups() {
      var groups = {}, out = [];
      lefts.forEach(function (x, i) { (groups[x] = groups[x] || []).push(i); });
      Object.keys(groups).forEach(function (k) { if (groups[k].length >= 2) out.push(groups[k]); });
      return out;
    }

    /* Biggest group of blocks that share a left edge. */
    function biggestGroup() {
      var groups = {};
      lefts.forEach(function (x, i) { (groups[x] = groups[x] || []).push(i); });
      var best = [];
      Object.keys(groups).forEach(function (k) {
        var g = groups[k];
        var hasActive = drag && g.indexOf(drag.i) >= 0;
        var bestHasActive = drag && best.indexOf(drag.i) >= 0;
        if (g.length > best.length || (g.length === best.length && hasActive && !bestHasActive)) best = g;
      });
      return best;
    }

    function renderAlign() {
      els.forEach(function (el, i) {
        el.style.transform = "translateX(" + lefts[i] + "px)";
        el.classList.toggle("active", !!drag && drag.i === i);
      });

      var group = biggestGroup();
      var n = group.length >= 2 ? group.length : 0;
      var all = n === BLOCKS.length;

      /* One purple line for each group, so two separate pairs both show. */
      var lined = linedUpGroups();
      els.forEach(function (el, i) {
        el.classList.toggle("on-guide", lined.some(function (g) { return g.indexOf(i) >= 0; }));
      });
      for (var k = 0; k < guides.length; k++) {
        var guide = guides[k], g = lined[k];
        if (!g) { guide.classList.remove("show"); continue; }
        var first = g[0], last = g[g.length - 1];
        var top = all ? 8 : BLOCKS[first].top - 8;
        var bottom = all ? H - 8 : BLOCKS[last].top + els[last].offsetHeight + 8;
        guide.style.left = lefts[first] + "px";
        guide.style.top = top + "px";
        guide.style.height = (bottom - top) + "px";
        guide.classList.add("show");
        guide.classList.toggle("all", all);
      }

      /* One status at a time, in one place under the poster. */
      if (all) Explorer.status("All lined up.", "good");
      else if (blocked) Explorer.status(NOTE_BLOCKED);
      else Explorer.status("Lined up: " + n + " of " + BLOCKS.length);
      return all;
    }

    function afterMove() {
      clearNudge();
      Explorer.used();   /* stops the pulse and checks for success */
    }

    function allLinedUp() { return !drag && biggestGroup().length === BLOCKS.length; }

    function clearNudge() {
      els.forEach(function (el) { el.classList.remove("nudge"); });
    }

    /* Guidance after a while without success: name one block to move. */
    function alignHint() {
      var group = biggestGroup();
      clearNudge();
      if (group.length < 2) return "Drag a block until a purple line shows.";
      for (var i = BLOCKS.length - 1; i >= 0; i--) {
        if (group.indexOf(i) < 0) {
          els[i].classList.add("nudge");
          return "Drag \u201C" + BLOCKS[i].text + "\u201D to the purple line.";
        }
      }
      return "";
    }

    function blockAt(clientY) {
      var r = poster.getBoundingClientRect();
      var y = (clientY - r.top) / scale;
      for (var i = 0; i < BLOCKS.length; i++) {
        if (y < ROW_EDGES[i + 1]) return i;
      }
      return BLOCKS.length - 1;
    }

    alignLayer.addEventListener("pointerdown", function (e) {
      if (mode !== "align" || drag) return;
      if (e.pointerType === "mouse" && e.button !== 0) return;
      var i = els.indexOf(e.target);
      if (i < 0) i = blockAt(e.clientY);
      e.preventDefault();
      drag = { i: i, id: e.pointerId, startX: e.clientX, startLeft: lefts[i], held: null };
      blocked = false;
      try { alignLayer.setPointerCapture(e.pointerId); } catch (err) { /* older browsers */ }
      alignLayer.classList.add("dragging");
      els[i].focus({ preventScroll: true });
      clearNudge();
      Explorer.used();   /* the pulse stops as soon as a block is picked up */
      renderAlign();
    });

    alignLayer.addEventListener("pointermove", function (e) {
      if (!drag || e.pointerId !== drag.id) return;
      var i = drag.i;
      var raw = drag.startLeft + (e.clientX - drag.startX) / scale;
      var x;
      if (drag.held !== null && Math.abs(raw - drag.held) <= HOLD && lefts.some(function (o, j) { return j !== i && o === drag.held; })) {
        x = drag.held;
      } else {
        var snap = nearestEdge(i, raw, SNAP);
        drag.held = snap;
        x = snap !== null ? snap : clamp(i, raw);
      }
      /* The pointer has gone past where this block can go. */
      var stopped = raw > maxLeft(i) + 2 || raw < EDGE - 2;
      if (x !== lefts[i] || stopped !== blocked) { lefts[i] = x; blocked = stopped; touched = true; renderAlign(); }
    });

    function endDrag(e) {
      if (!drag || (e && e.pointerId !== drag.id)) return;
      var moved = lefts[drag.i] !== drag.startLeft;
      try { alignLayer.releasePointerCapture(drag.id); } catch (err) { /* already released */ }
      drag = null;
      alignLayer.classList.remove("dragging");
      renderAlign();
      if (moved) afterMove();
    }
    alignLayer.addEventListener("pointerup", endDrag);
    alignLayer.addEventListener("pointercancel", endDrag);
    alignLayer.addEventListener("lostpointercapture", endDrag);
    window.addEventListener("blur", function () { endDrag(null); });
    alignLayer.addEventListener("dragstart", function (e) { e.preventDefault(); });

    function onKey(e, i) {
      if (mode !== "align") return;
      var dir = e.key === "ArrowLeft" ? -1 : (e.key === "ArrowRight" ? 1 : 0);
      if (!dir) return;
      e.preventDefault();
      var want = lefts[i] + dir * KEY_STEP;
      var target = clamp(i, want);
      var stopped = want > maxLeft(i) || want < EDGE;
      /* Snap only to an edge that is ahead of where the block started,
         so a key press never moves the block backwards. */
      var snap = nearestEdge(i, target, SNAP);
      if (snap !== null && (snap - lefts[i]) * dir > 0) target = snap;
      if (target === lefts[i]) {
        if (stopped !== blocked) { blocked = stopped; renderAlign(); }
        return;
      }
      lefts[i] = target;
      blocked = stopped;
      touched = true;
      renderAlign();
      afterMove();
    }

    /* ---------- Poster 2: press Enter where each idea ends ---------- */

    /* The Enter key, drawn as a small key with a return arrow. */
    var KEY_SVG = '<svg viewBox="0 0 36 27" aria-hidden="true">' +
      '<rect x="1.5" y="1.5" width="33" height="24" rx="5" fill="#fff" stroke="#7C3AED" stroke-width="2.5"/>' +
      '<path d="M26 7v7.5H11" fill="none" stroke="#7C3AED" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<path d="M15 10.2l-4.6 4.3 4.6 4.3" fill="none" stroke="#7C3AED" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    function isIdeaEnd(i) { return IDEA_ENDS.indexOf(i) >= 0; }
    function rightBreaks() { return IDEA_ENDS.filter(function (i) { return breaks[i]; }).length; }
    function splitBreaks() {
      var n = 0;
      breaks.forEach(function (on, i) { if (on && !isIdeaEnd(i)) n += 1; });
      return n;
    }
    function allSplit() { return rightBreaks() === IDEA_ENDS.length && splitBreaks() === 0; }

    /* focus: { word: i } or { key: i } to keep the keyboard in place.
       newStart: first word of a paragraph that was just made, so it fades in. */
    function renderPara(focus, newStart) {
      textEl.innerHTML = "";
      var para = null;
      WALL.forEach(function (word, i) {
        if (!para) {
          para = document.createElement("div");
          para.className = "ap-para-block" + (i === newStart ? " new" : "");
          textEl.appendChild(para);
        }
        var w = document.createElement("span");
        w.className = "ap-word";
        w.textContent = word;
        w.setAttribute("data-word", i);
        if (i === WALL.length - 1) {
          w.className += " last";       /* the text ends here: nothing to split */
          para.appendChild(w);
          return;
        }
        w.setAttribute("role", "button");
        w.setAttribute("tabindex", "0");
        w.setAttribute("aria-label", word + " Press Enter to start a new paragraph after this word.");
        para.appendChild(w);
        if (breaks[i]) {
          var k = document.createElement("button");
          k.type = "button";
          k.className = "ap-key" + (isIdeaEnd(i) ? "" : " split");
          k.setAttribute("data-join", i);
          k.setAttribute("aria-label", "Enter after " + word + ". Click to join the text back.");
          k.innerHTML = KEY_SVG;
          para.appendChild(k);
          var gap = document.createElement("div");
          gap.className = "ap-gapbar";
          gap.setAttribute("data-join", i);
          textEl.appendChild(gap);
          para = null;
        } else {
          para.appendChild(document.createTextNode(" "));
        }
      });

      /* Shrink the text if it no longer fits on the poster. */
      /* With very many breaks, use two columns so it still fits. */
      function fit(cols, min) {
        textEl.style.columnCount = cols > 1 ? String(cols) : "";
        var size = 23;
        textEl.style.fontSize = size + "px";
        while (textEl.offsetHeight > H - 44 && size > min) {
          size -= 1;
          textEl.style.fontSize = size + "px";
        }
        return textEl.offsetHeight <= H - 44;
      }
      if (!fit(1, 15) && !fit(2, 12)) fit(3, 10);

      /* One status: guidance while an idea is split, otherwise progress. */
      if (splitBreaks()) Explorer.status(NOTE_SPLIT, "hint");
      else Explorer.status("Paragraphs: " + (rightBreaks() + 1) + " of " + (IDEA_ENDS.length + 1));

      if (focus) {
        var sel = focus.key !== undefined ? '.ap-key[data-join="' + focus.key + '"]' : '[data-word="' + focus.word + '"]';
        var again = textEl.querySelector(sel) || textEl.querySelector('[data-word="' + (focus.key !== undefined ? focus.key : focus.word) + '"]');
        if (again) again.focus({ preventScroll: true });
      }
    }

    /* Press Enter after word i (or join the text back if Enter is already there). */
    function pressEnter(i, focus) {
      var made = -1;
      breaks[i] = !breaks[i];
      if (breaks[i]) made = i + 1;
      renderPara(focus, made);
      Explorer.used();
    }

    function join(i, focus) {
      breaks[i] = false;
      renderPara(focus);
      Explorer.used();
    }

    /* Guidance after a while: point at the full stops. */
    function paraHint() { return allSplit() ? "" : "Look for a full stop."; }

    /* A click between words counts as a click just after the word before it,
       so pupils do not need to hit a word exactly. */
    function wordAt(clientX, clientY) {
      var nodes = textEl.querySelectorAll("[data-word]");
      var best = null, bestD = Infinity, lineBest = null, lineRight = -Infinity;
      for (var k = 0; k < nodes.length; k++) {
        var r = nodes[k].getBoundingClientRect();
        var sameLine = clientY >= r.top - 2 && clientY <= r.bottom + 2;
        if (sameLine && clientX >= r.left && clientX <= r.right) return nodes[k];
        if (sameLine && r.right <= clientX && r.right > lineRight) { lineRight = r.right; lineBest = nodes[k]; }
        var dx = clientX < r.left ? r.left - clientX : (clientX > r.right ? clientX - r.right : 0);
        var dy = clientY < r.top ? r.top - clientY : (clientY > r.bottom ? clientY - r.bottom : 0);
        var d = dx + dy * 3;
        if (d < bestD) { bestD = d; best = nodes[k]; }
      }
      return lineBest || best;
    }

    paraLayer.addEventListener("click", function (e) {
      if (mode !== "para") return;
      var t = e.target.closest ? e.target.closest("[data-join], [data-word]") : null;
      var kb = e.detail === 0;   /* 0 when a button is pressed with Enter or Space */
      if (t && t.hasAttribute("data-join")) {
        var j = Number(t.getAttribute("data-join"));
        join(j, kb ? { word: j } : null);
        return;
      }
      if (!t) t = wordAt(e.clientX, e.clientY);
      if (!t || t.classList.contains("last")) return;
      var i = Number(t.getAttribute("data-word"));
      if (breaks[i]) return;   /* Enter is already there: click the key to join */
      pressEnter(i, null);
    });

    /* Keyboard: Tab through the words, Enter (or Space) presses Enter after the word. */
    paraLayer.addEventListener("keydown", function (e) {
      if (mode !== "para" || (e.key !== "Enter" && e.key !== " ")) return;
      var t = e.target;
      if (!t.hasAttribute || !t.hasAttribute("data-word") || t.classList.contains("last")) return;
      e.preventDefault();
      var i = Number(t.getAttribute("data-word"));
      pressEnter(i, { word: i });
    });

    /* ---------- Switching, layout, reset ---------- */

    function setMode(m) {
      mode = m;
      var para = mode === "para";
      alignLayer.hidden = para;
      paraLayer.hidden = !para;
      blocked = false;
      if (para) { renderPara(); } else { measure(); renderAlign(); }
    }

    /* Scale the poster to fill the space above the status line. */
    function layout() {
      if (!area.clientHeight) return;   /* the Explore screen is not showing */
      var cs = getComputedStyle(area);
      var availW = area.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 4;
      var availH = area.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom)
                   - statusEl.offsetHeight - (parseFloat(cs.rowGap) || 10) - 4;
      scale = Math.max(0.6, Math.min(1.5, availW / W, availH / H));
      poster.style.transform = "scale(" + scale + ")";
      wrap.style.width = Math.round(W * scale) + "px";
      wrap.style.height = Math.round(H * scale) + "px";
    }

    function refresh() {
      layout();
      measure();
      if (mode === "align") renderAlign(); else renderPara();
    }

    Explorer.setup({
      keyword: { word: "Align", meaning: "Line things up along the same edge.", tile: "shared/tiles/align.png" },
      bridge: { title: "Later, in Canva", img: "shared/canva/text-toolbar.png", imgW: 1720, imgH: 88, crop: [1100, 620], focus: [1478, 136], alt: "Canva toolbar with the Position button ringed", text: "Select the blocks. Click Position. Pick an edge." },
      /* Step 1: all four blocks share a left edge. */
      pulse: ".ap-block",
      success: allLinedUp,
      hint: alignHint,
      hintAfter: 60,
      onShow: refresh,
      onReset: function () {
        drag = null;
        blocked = false;
        touched = false;
        clearNudge();
        alignLayer.classList.remove("dragging");
        lefts = BLOCKS.map(function (b) { return b.start; });
        breaks = [];
        setMode("align");
      },
      /* Step 2: press Enter after "lunchtime.", "4." and "beginners.",
         with no break in the middle of an idea. */
      challenge: {
        text: "Press Enter where each idea ends.",
        start: function () { breaks = []; setMode("para"); },
        success: allSplit,
        successText: "Each idea has its own paragraph.",
        hint: paraHint,
        pulse: "#ap-text"
      }
    });

    setMode("align");
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(refresh);
    if (window.ResizeObserver) new ResizeObserver(layout).observe(area);
    window.addEventListener("resize", layout);
  })();
</script>
</body>
</html>
