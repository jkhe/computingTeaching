<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sort to find it</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/explorer.css?v=2">
<style>
  :root {
    --rh: 30px;   /* row height, set in JS to fill the space */
    --hh: 52px;   /* heading height */
    --stripe: #ECEFF3;
  }

  .sf-wrap {
    flex: 1 1 0px;
    min-height: 0;
    width: 100%;
    max-width: 1000px;
    display: flex;
    align-items: center;
  }
  /* Stripes are painted behind the rows, so they stay still while rows move. */
  .sf-table-wrap {
    width: 100%;
    border-radius: 10px;
    overflow: hidden;
    background-color: var(--panel);
    background-image: repeating-linear-gradient(to bottom,
      #FFFFFF 0, #FFFFFF var(--rh), var(--stripe) var(--rh), var(--stripe) calc(var(--rh) * 2));
    background-position: 0 calc(var(--hh) + 6px);
    background-repeat: no-repeat;
    border: 2px solid var(--line);
  }
  table.sf { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 20px; font-weight: 700; }
  .sf col.place { width: 32%; }
  .sf th { padding: 4px 3px 2px; height: calc(var(--hh) + 6px); background: var(--panel); }
  .sf th:first-child { padding-left: 4px; }
  .sf th:last-child { padding-right: 4px; }
  .sortbtn {
    width: 100%;
    height: var(--hh);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    font-family: var(--font);
    color: var(--text);
    background: var(--panel);
    border: 2px solid var(--line-strong);
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .sortbtn:hover { border-color: var(--accent); background: var(--accent-soft); }
  .sortbtn:focus-visible { outline: 3px solid var(--accent); outline-offset: -5px; }
  .sortbtn .name { font-size: 19px; font-weight: 800; line-height: 1.15; }
  .sortbtn .dir { display: flex; align-items: center; gap: 5px; font-size: 14px; font-weight: 800; line-height: 1.15; color: var(--muted); }
  .sortbtn svg { width: 12px; height: 12px; flex-shrink: 0; }
  .sortbtn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .sortbtn.active .dir { color: #fff; }
  .sortbtn.active:focus-visible { outline-color: #fff; }

  .sf td {
    height: var(--rh);
    line-height: var(--rh);
    padding: 0 14px;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    font-variant-numeric: tabular-nums;
  }
  .sf td:first-child { text-align: left; }
  .sf td.sorted { background: rgba(15, 118, 110, 0.14); font-weight: 800; color: #1F2937; }
  .sf tbody tr { will-change: transform; }
  .sf tbody tr:first-child td.sorted { background: rgba(15, 118, 110, 0.28); }

  /* ----- Start screen demo: a pointer clicks a heading, the rows swap ----- */
  .sf-demo .d-head { position: absolute; left: 30px; right: 30px; top: 16px; height: 30px; display: flex; gap: 6px; }
  .sf-demo .d-head span { flex: 1; border: 2px solid var(--line-strong); border-radius: 6px; }
  .sf-demo .d-head span.go { flex: 0 0 80px; animation: sf-d-on 3.6s steps(1, end) infinite; }
  .sf-demo .d-row { position: absolute; left: 30px; right: 30px; height: 26px; display: flex; gap: 6px; align-items: center; padding: 0 6px; background: #ECEFF3; border-radius: 4px; }
  .sf-demo .d-row b { height: 9px; border-radius: 3px; background: #6B7280; }
  .sf-demo .d-row b:first-child { flex: 1; }
  .sf-demo .d-row b:last-child { flex: 0 0 50px; background: var(--accent); }
  .sf-demo .r1 { top: 58px; animation: sf-d-r1 3.6s ease-in-out infinite; }
  .sf-demo .r2 { top: 92px; }
  .sf-demo .r3 { top: 126px; animation: sf-d-r3 3.6s ease-in-out infinite; }
  .sf-demo .r1 b:last-child { flex-basis: 64px; }
  .sf-demo .r3 b:last-child { flex-basis: 20px; }
  .sf-demo .ex-ghost { left: 246px; top: 30px; animation: sf-d-ptr 3.6s ease-in-out infinite; }
  .sf-demo .d-arrow { display: none; }
  @keyframes sf-d-on { 0% { background: #fff; } 25% { background: var(--accent); border-color: var(--accent); } 92% { background: #fff; border-color: var(--line-strong); } }
  @keyframes sf-d-r1 { 0%, 30% { transform: none; } 50%, 88% { transform: translateY(68px); } 100% { transform: none; } }
  @keyframes sf-d-r3 { 0%, 30% { transform: none; } 50%, 88% { transform: translateY(-68px); } 100% { transform: none; } }
  @keyframes sf-d-ptr { 0% { transform: translate(-60px, 90px); } 22%, 90% { transform: none; } 100% { transform: translate(-60px, 90px); } }
  @media (prefers-reduced-motion: reduce) {
    /* A still frame: the heading chosen and an arrow showing the swap. */
    .sf-demo .d-head span.go, .sf-demo .r1, .sf-demo .r3, .sf-demo .ex-ghost { animation: none !important; }
    .sf-demo .d-head span.go { background: var(--accent); border-color: var(--accent); }
    .sf-demo .d-row { right: 50px; }
    .sf-demo .d-arrow { display: block; position: absolute; right: 26px; top: 76px; width: 4px; height: 58px; background: var(--accent); }
    .sf-demo .d-arrow::before { content: ""; position: absolute; left: -7px; top: -10px; border: 9px solid transparent; border-top: 0; border-bottom: 12px solid var(--accent); }
    .sf-demo .ex-ghost { left: 246px; top: 30px; }
  }

  @media (max-width: 1100px), (max-height: 620px) {
    table.sf { font-size: 18px; }
    .sortbtn .name { font-size: 17px; }
    .sortbtn .dir { font-size: 13px; }
    .sf td { padding: 0 10px; }
  }
</style>
</head>
<body class="unit-6 ex-v2">

<!-- SCREEN 1: Start -->
<section class="ex-screen ex-start" id="ex-start">
  <h1>Sort to find it</h1>
  <p class="ex-why">Sorting finds answers in a big table fast.</p>
  <div class="ex-demo sf-demo" aria-hidden="true">
    <span class="d-head"><span></span><span></span><span class="go"></span></span>
    <span class="d-row r1"><b></b><b></b></span>
    <span class="d-row r2"><b></b><b></b></span>
    <span class="d-row r3"><b></b><b></b></span>
    <span class="d-arrow"></span>
    <svg class="ex-ghost" viewBox="0 0 24 24"><path d="M5 2l14 11h-7.2l4 7.6-3 1.6-4-7.7L5 19z"/></svg>
  </div>
  <p class="ex-how">Click a column name.</p>
  <button type="button" class="ex-btn primary big" id="ex-go">Start</button>
</section>

<!-- SCREEN 2: Explore -->
<section class="ex-screen" id="ex-explore" hidden>
  <div class="ex-top">
    <span class="ex-steps" id="ex-steps" aria-hidden="true"><i></i><i></i></span>
    <p class="ex-instruction" id="ex-instruction">Find the quietest place on average.</p>
    <button type="button" class="ex-quiet" id="ex-reset">Start again</button>
  </div>
  <div class="ex-area" id="sf-area">
    <div class="sf-wrap" id="sf-wrap">
      <div class="sf-table-wrap">
        <table class="sf" id="table">
          <caption class="ex-visually-hidden">Sound readings in the park, from 0 (silent) to 255 (very loud)</caption>
          <colgroup><col class="place"><col><col><col><col></colgroup>
          <thead><tr id="head"></tr></thead>
          <tbody id="body"></tbody>
        </table>
      </div>
    </div>
    <p class="ex-status" id="ex-status" role="status"></p>
  </div>
</section>

<script src="shared/explorer.js?v=2"></script>
<script>
  (function () {
    "use strict";

    /* Invented sound readings (micro:bit sound level, 0 to 255).
       The average is worked out below, rounded to a whole number.
       Built so that:
       - Lavender garden is quietest on average, but Pond is lowest in Reading 1.
       - Playground is loudest on average, but the loudest single reading
         (236) is at Cafe by the road, in Reading 2. */
    var DATA = [
      ["Main gate", 149, 160, 144],
      ["Basketball cage", 169, 188, 171],
      ["Pond", 36, 52, 53],
      ["By the tennis courts", 138, 151, 137],
      ["Playground", 207, 195, 201],
      ["Picnic area", 73, 79, 76],
      ["Car park", 127, 140, 132],
      ["Lavender garden", 41, 33, 40],
      ["Cafe by the road", 121, 236, 117],
      ["Bandstand", 84, 97, 86],
      ["Middle of the park", 58, 71, 63],
      ["Dog walking area", 118, 104, 114]
    ];
    var COLS = ["Place", "Reading 1", "Reading 2", "Reading 3", "Average"];
    var AVG = 4, R2 = 2;

    var ICON_UP = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5 11 10.5H1Z" fill="currentColor"/></svg>';
    var ICON_DOWN = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 10.5 11 1.5H1Z" fill="currentColor"/></svg>';
    var ICON_BOTH = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 0.5 9.5 5H2.5ZM6 11.5 9.5 7H2.5Z" fill="currentColor"/></svg>';

    var area = document.getElementById("sf-area");
    var wrap = document.getElementById("sf-wrap");
    var statusEl = document.getElementById("ex-status");
    var head = document.getElementById("head");
    var body = document.getElementById("body");
    var reduced = window.matchMedia("(prefers-reduced-motion: reduce)");

    var rows = [];      /* { values: [...], tr: element, start: n } */
    var sortCol = -1;   /* -1 = not sorted yet */
    var ascending = true;

    function build() {
      var i, c;
      for (c = 0; c < COLS.length; c++) {
        var th = document.createElement("th");
        th.setAttribute("scope", "col");
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "sortbtn";
        btn.setAttribute("data-col", c);
        btn.innerHTML = '<span class="name">' + COLS[c] + '</span><span class="dir"></span>';
        btn.addEventListener("click", onSort);
        th.appendChild(btn);
        head.appendChild(th);
      }
      for (i = 0; i < DATA.length; i++) {
        var d = DATA[i];
        var avg = Math.round((d[1] + d[2] + d[3]) / 3);
        var values = [d[0], d[1], d[2], d[3], avg];
        var tr = document.createElement("tr");
        for (c = 0; c < values.length; c++) {
          var cell = document.createElement("td");
          cell.textContent = values[c];
          tr.appendChild(cell);
        }
        rows.push({ values: values, tr: tr, start: i });
      }
    }

    function dirWords(col, asc) {
      if (col === 0) return asc ? "A to Z" : "Z to A";
      return asc ? "Smallest first" : "Biggest first";
    }

    function order() {
      var list = rows.slice();
      if (sortCol < 0) {
        list.sort(function (a, b) { return a.start - b.start; });
        return list;
      }
      list.sort(function (a, b) {
        var x = a.values[sortCol], y = b.values[sortCol], r;
        if (sortCol === 0) r = x.localeCompare(y);
        else r = x - y;
        if (r === 0) r = a.values[0].localeCompare(b.values[0]);
        return ascending ? r : -r;
      });
      return list;
    }

    function render(animate) {
      var i, c, first = [];
      var list = order();
      if (animate) {
        for (i = 0; i < rows.length; i++) first.push(rows[i].tr.getBoundingClientRect().top);
      }
      for (i = 0; i < list.length; i++) {
        body.appendChild(list[i].tr);
        var cells = list[i].tr.children;
        for (c = 0; c < cells.length; c++) cells[c].className = c === sortCol ? "sorted" : "";
      }
      /* FLIP: start each row where it was, then let it glide to its new place. */
      if (animate && !reduced.matches) {
        for (i = 0; i < rows.length; i++) {
          var tr = rows[i].tr;
          tr.style.transition = "none";
          tr.style.transform = "";
          var dy = first[i] - tr.getBoundingClientRect().top;
          tr.style.transform = dy ? "translateY(" + dy + "px)" : "";
        }
        body.getBoundingClientRect();
        for (i = 0; i < rows.length; i++) {
          rows[i].tr.style.transition = "transform 0.5s ease";
          rows[i].tr.style.transform = "";
        }
      } else {
        for (i = 0; i < rows.length; i++) {
          rows[i].tr.style.transition = "none";
          rows[i].tr.style.transform = "";
        }
      }
      var btns = head.querySelectorAll(".sortbtn");
      for (c = 0; c < btns.length; c++) {
        var active = c === sortCol;
        btns[c].classList.toggle("active", active);
        btns[c].querySelector(".dir").innerHTML = active
          ? (ascending ? ICON_UP : ICON_DOWN) + "<span>" + dirWords(c, ascending) + "</span>"
          : ICON_BOTH + "<span>Sort</span>";
        btns[c].parentNode.setAttribute("aria-sort", active ? (ascending ? "ascending" : "descending") : "none");
      }
    }

    function onSort(e) {
      var col = Number(e.currentTarget.getAttribute("data-col"));
      if (col === sortCol) ascending = !ascending;
      else { sortCol = col; ascending = true; }
      render(true);
      Explorer.status("Top row: " + body.firstElementChild.firstElementChild.textContent + ".");
      Explorer.used();
    }

    /* Rows grow to fill the space between the instruction and the status line. */
    function layout() {
      if (!area.clientHeight) return;
      var cs = getComputedStyle(area);
      var availH = area.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom)
                   - statusEl.offsetHeight - (parseFloat(cs.rowGap) || 10) - 4;
      var hh = availH > 470 ? 52 : 44;
      var rh = Math.floor((availH - hh - 6 - 4) / DATA.length);
      rh = Math.max(20, Math.min(36, rh));
      document.documentElement.style.setProperty("--hh", hh + "px");
      document.documentElement.style.setProperty("--rh", rh + "px");
    }

    function sortedBy(col, asc) { return sortCol === col && ascending === asc; }

    Explorer.setup({
      pulse: ".sortbtn",
      success: function () { return sortedBy(AVG, true); },
      successText: "Lavender garden is the quietest on average.",
      hint: "Which column shows the average?",
      hintAfter: 60,
      onShow: layout,
      onReset: function () {
        sortCol = -1;
        ascending = true;
        render(false);
        Explorer.status("");
      },
      challenge: {
        text: "Find the loudest single reading.",
        start: function () { Explorer.status(""); },
        pulse: ".sortbtn",
        success: function () { return sortedBy(R2, false); },
        successText: "236, at Cafe by the road, is the loudest reading.",
        hint: "Sort each Reading column, biggest first."
      }
    });

    build();
    render(false);
    if (window.ResizeObserver) new ResizeObserver(layout).observe(area);
    window.addEventListener("resize", layout);
  })();
</script>
</body>
</html>
