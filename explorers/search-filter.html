<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search criteria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/explorer.css?v=4">
<style>
  /* Page-specific styles only. */
  .sf-box {
    flex: 0 1 auto;
    min-height: 0;
    width: 100%;
    max-width: 1160px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 8px;
  }

  /* Mock search bar, with the criteria buttons right under it */
  .sf-bar {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; overflow: hidden;
    border: 2px solid var(--line-strong); border-radius: 999px; padding: 4px 18px; min-height: 48px;
    background: var(--panel);
  }
  .sf-bar svg { flex-shrink: 0; }
  .sf-term { font-size: 20px; font-weight: 800; color: var(--text); background: #F3F4F6; border-radius: 8px; padding: 1px 10px; white-space: nowrap; }
  .sf-term.added { background: var(--accent-soft); color: var(--accent); border: 2px solid var(--accent); padding: 0 9px; animation: ex-fade 0.25s ease; }
  .sf-term.filter { background: var(--accent); color: #fff; border-radius: 999px; padding: 1px 12px; font-size: 16px; animation: ex-fade 0.25s ease; }
  .sf-bar .sf-gap { flex: 1; }
  .sf-count { margin-left: auto; font-size: 15px; font-weight: 800; color: var(--muted); white-space: nowrap; padding-left: 8px; }

  .sf-chips { flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .sf-chips .ex-btn { border-radius: 999px; min-width: 70px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .sf-chips .ex-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
  .sf-chips .ex-btn svg path { fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linejoin: round; }
  .sf-plus { font-size: 20px; line-height: 1; }
  .sf-chips .ex-btn[aria-pressed="true"] .sf-plus { display: none; }
  .sf-divider { width: 2px; height: 30px; background: var(--line-strong); margin: 0 6px; }

  /* Top results */
  .sf-results { flex: 0 1 300px; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 10px; }
  .sf-card {
    border: 2px solid var(--line-strong); border-left-width: 8px; border-radius: 12px; padding: 6px 12px;
    display: flex; flex-direction: column; justify-content: center; gap: 2px; min-width: 0; min-height: 0; overflow: hidden;
    background: var(--panel); position: relative;
  }
  .sf-card.new { animation: ex-fade 0.3s ease; }
  .sf-card.answers { border-color: var(--good); background: var(--good-soft); }
  .sf-title { font-size: 21px; font-weight: 800; line-height: 1.25; color: #1F2937; padding-right: 26px; }
  .sf-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 8px; font-size: 14px; color: var(--muted); line-height: 1.3; }
  .sf-meta .sf-source { font-weight: 800; color: var(--accent); }
  .sf-type { font-size: 13px; font-weight: 800; border-radius: 6px; padding: 0 8px; border: 2px solid currentColor; }
  .sf-type.video { color: #6D28D9; background: #F5F3FF; }
  .sf-type.article { color: #374151; background: #F3F4F6; }
  .sf-type.shop { color: var(--ok); background: var(--ok-soft); }
  .sf-snip { font-size: 17px; line-height: 1.3; color: var(--text); }
  /* A green tick on each result that answers the question. */
  .sf-yes { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; }

  /* ----- Start screen demo: a ghost pointer adds "puppy" to the search ----- */
  .sf-d-bar { position: absolute; left: 22px; right: 22px; top: 26px; height: 40px; border: 2px solid var(--line-strong); border-radius: 999px; }
  .sf-d-term { position: absolute; top: 34px; height: 24px; line-height: 24px; font-size: 16px; font-weight: 800; border-radius: 6px; padding: 0 8px; }
  .sf-d-term.dogs { left: 40px; background: #F3F4F6; }
  .sf-d-term.pup { left: 100px; background: var(--accent-soft); color: var(--accent); border: 2px solid var(--accent); line-height: 20px; opacity: 0; animation: sf-d-pup 3.4s ease infinite; }
  .sf-d-chip { position: absolute; left: 112px; top: 100px; width: 96px; height: 38px; line-height: 34px; text-align: center; font-size: 16px; font-weight: 800; border: 2px solid var(--line-strong); border-radius: 999px; background: #fff; animation: sf-d-chip 3.4s ease infinite; }
  .sf-d-move { position: absolute; left: 230px; top: 140px; animation: sf-d-move 3.4s ease-in-out infinite; }
  .sf-d-move .ex-ghost { left: 0; top: 0; }
  .sf-d-arrow { display: none; }
  @keyframes sf-d-move { 0%, 10% { transform: translate(0, 0); } 40%, 85% { transform: translate(-28px, -22px); } 100% { transform: translate(0, 0); } }
  @keyframes sf-d-chip { 0%, 42% { background: #fff; color: var(--text); border-color: var(--line-strong); } 46%, 88% { background: var(--accent); color: #fff; border-color: var(--accent); } 94%, 100% { background: #fff; color: var(--text); border-color: var(--line-strong); } }
  @keyframes sf-d-pup { 0%, 44% { opacity: 0; } 50%, 88% { opacity: 1; } 94%, 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    /* A still frame: the chip, the pointer on it, and an arrow up to the search bar. */
    .sf-d-move, .sf-d-chip, .sf-d-term.pup { animation: none !important; }
    .sf-d-move { transform: translate(-28px, -22px); }
    .sf-d-term.pup { opacity: 0.35; border-style: dashed; }
    .sf-d-arrow { display: block; position: absolute; left: 116px; top: 66px; width: 4px; height: 30px; background: var(--accent); }
    .sf-d-arrow::before { content: ""; position: absolute; left: -8px; top: -8px; border: 10px solid transparent; border-top: 0; border-bottom: 12px solid var(--accent); }
  }

  @media (max-width: 1100px), (max-height: 620px) {
    .sf-box { gap: 6px; }
    .sf-bar { min-height: 42px; padding: 3px 14px; }
    .sf-term { font-size: 17px; }
    .sf-count { font-size: 14px; }
    .sf-title { font-size: 17px; }
    .sf-snip { font-size: 14px; }
    .sf-meta { font-size: 13px; }
    .sf-yes { width: 22px; height: 22px; }
    .sf-chips { gap: 8px; }
    .sf-chips .ex-btn { padding: 4px 12px; min-height: 42px; }
  }
</style>
</head>
<body class="unit-3 ex-v2">

<!-- SCREEN 1: Start -->
<section class="ex-screen ex-start" id="ex-start">
  <h1>Search criteria</h1>
  <p class="ex-why">Good search words find answers faster.</p>
  <div class="ex-demo" aria-hidden="true">
    <span class="sf-d-bar"></span>
    <span class="sf-d-term dogs">dogs</span>
    <span class="sf-d-term pup">puppy</span>
    <span class="sf-d-arrow"></span>
    <span class="sf-d-chip">+ puppy</span>
    <span class="sf-d-move">
      <svg class="ex-ghost" viewBox="0 0 24 24"><path d="M5 2l14 11h-7.2l4 7.6-3 1.6-4-7.7L5 19z"/></svg>
    </span>
  </div>
  <p class="ex-how">Add words.</p>
  <button type="button" class="ex-btn primary big" id="ex-go">Start</button>
</section>

<!-- SCREEN 2: Explore -->
<section class="ex-screen" id="ex-explore" hidden>
  <div class="ex-top">
    <span class="ex-steps" id="ex-steps" aria-hidden="true"><i></i><i></i></span>
    <p class="ex-instruction" id="ex-instruction">Get results that answer: how do I teach a puppy to sit?</p>
    <button type="button" class="ex-quiet" id="ex-reset">Start again</button>
  </div>
  <div class="ex-area">
    <div class="sf-box">
      <div class="sf-bar" id="sf-bar" aria-label="Search" aria-live="polite"></div>
      <div class="sf-chips" id="sf-chips" role="group" aria-label="Search words and filters">
        <button type="button" class="ex-btn" data-c="puppy" aria-pressed="false"><span class="sf-plus" aria-hidden="true">+</span>puppy</button>
        <button type="button" class="ex-btn" data-c="teach" aria-pressed="false"><span class="sf-plus" aria-hidden="true">+</span>teach</button>
        <button type="button" class="ex-btn" data-c="sit" aria-pressed="false"><span class="sf-plus" aria-hidden="true">+</span>sit</button>
        <button type="button" class="ex-btn" data-c="uk" aria-pressed="false"><span class="sf-plus" aria-hidden="true">+</span>UK</button>
        <span class="sf-divider" aria-hidden="true"></span>
        <!-- Filters carry a funnel icon so they look different from words. -->
        <button type="button" class="ex-btn" data-c="video" aria-pressed="false" aria-label="Filter: Videos only"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18l-7 8.5V19l-4 2v-8.5z"/></svg>Videos only</button>
        <button type="button" class="ex-btn" data-c="recent" aria-pressed="false" aria-label="Filter: Past year"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18l-7 8.5V19l-4 2v-8.5z"/></svg>Past year</button>
      </div>
      <div class="sf-results" id="sf-results" aria-label="Top 4 results"></div>
    </div>
    <p class="ex-status" id="ex-status" role="status"></p>
  </div>
</section>

<script src="shared/explorer.js?v=4"></script>
<script>
  (function () {
    "use strict";

    /* ------------------------------------------------------------------
       RESULTS COUNT MODEL (illustrative only, not real search data)

       The search "dogs" starts at about 2,400,000 results. Each criterion
       that is switched on divides the count by a fixed factor:
         puppy 6, teach 8, sit 5, UK 3, Videos only 4, Past year 3
       The answer is rounded to two significant figures and shown as
       "About N results". All six on gives about 280.
       ------------------------------------------------------------------ */
    var START_COUNT = 2400000;
    var FACTOR = { puppy: 6, teach: 8, sit: 5, uk: 3, video: 4, recent: 3 };
    var ORDER = ["puppy", "teach", "sit", "uk", "video", "recent"];
    var BAR_TEXT = { puppy: "puppy", teach: "teach", sit: "sit", uk: "UK", video: "Videos only", recent: "Past year" };

    /* Invented results, in ranked order. Every site name is made up.
       k = search words the result matches, uk = UK result,
       m = how many months old it is, ans = it answers
       "How do I teach a puppy to sit?" */
    function R(title, source, type, snip, k, uk, m, ans) {
      return { title: title, source: source, type: type, snip: snip, k: k, uk: uk, m: m, ans: !!ans };
    }
    var RESULTS = [
      R("Dogs: facts for kids", "Animal Fact File", "Article", "Where dogs come from and how they live.", "", false, 30),
      R("Dog food delivered to your door", "Bowl and Bone", "Shop", "Free delivery on your first order.", "", true, 2),
      R("Ten funny dog clips", "ClipBarn", "Video", "Dogs falling off sofas and chasing tails.", "", false, 4),
      R("A guide to dog breeds", "Dog Help Hub", "Article", "Big dogs, small dogs and everything between.", "", false, 50),
      R("Top 100 dog names", "Petwise", "Article", "The most popular names this year.", "", true, 7),
      R("Dog beds, bowls and leads", "Tails and Trails", "Shop", "Everything your dog needs.", "", true, 3),
      R("Dogs looking for a home", "Second Chance Kennels", "Article", "Meet the dogs waiting to be adopted.", "", true, 1),
      R("Dog show highlights", "ClipBarn", "Video", "The best moments from the summer show.", "", true, 5),
      R("Dog park walks", "ClipBarn", "Video", "A relaxing walk with three dogs.", "", true, 9),
      R("Meet our rescue dogs", "Second Chance Kennels", "Video", "A short film about the kennels.", "", true, 11),

      R("Puppy food: what to buy", "Bowl and Bone", "Shop", "Food made for growing puppies.", "puppy", true, 6),
      R("Cute puppy clips", "ClipBarn", "Video", "Ten minutes of sleepy puppies.", "puppy", false, 2),
      R("Bringing a new puppy home", "Dog Help Hub", "Article", "What to get ready before the first day.", "puppy", false, 28),
      R("Puppy toys and chews", "Tails and Trails", "Shop", "Safe toys for small teeth.", "puppy", true, 8),
      R("When do puppies stop growing?", "Animal Fact File", "Article", "Most are fully grown by age two.", "puppy", false, 40),

      R("Teach an old dog new tricks", "Dog Help Hub", "Article", "Older dogs can still learn.", "teach", false, 36),
      R("Teach your dog to fetch", "Pawsitive Training", "Video", "Start with a ball your dog likes.", "teach", false, 10),

      R("Dog sitting: we mind your dog", "StayPaws", "Shop", "Book a dog sitter for the weekend.", "sit", true, 4),
      R("Why does my dog sit on my feet?", "Petwise", "Article", "Five reasons dogs do this.", "sit", false, 26),
      R("Dogs that sit like people", "ClipBarn", "Video", "Funny clips of dogs on sofas.", "sit", false, 3),

      R("Teach an older dog to sit", "Dog Help Hub", "Article", "Tips for dogs over two years old.", "teach sit", false, 10),
      R("My puppy will not sit still", "Petwise", "Article", "Why young puppies are so busy.", "puppy sit", false, 8),
      R("Teach your dog to sit still in the car", "Pawsitive Training", "Video", "Keep your dog calm on a drive.", "teach sit", false, 7),
      R("My puppy tries to sit on the cat", "ClipBarn", "Video", "A funny clip of a puppy and a cat.", "puppy sit", false, 6),

      R("Teach a puppy to walk on a lead", "Pawsitive Training", "Video", "Short walks first, then longer ones.", "puppy teach", false, 11),
      R("Teach your puppy to sit in 5 steps", "Pawsitive Training", "Article", "Hold a treat above its nose.", "puppy teach sit", false, 3, true),
      R("Teach your puppy its name", "Dog Help Hub", "Article", "Say the name, then give a treat.", "puppy teach", false, 24),
      R("Watch: teach a puppy to sit", "Pawsitive Training", "Video", "See each step with a real puppy.", "puppy teach sit", false, 5, true),
      R("Teach a puppy where to toilet", "Petwise", "Article", "Take your puppy outside often.", "puppy teach", true, 9),
      R("Puppy classes: we teach manners", "Wagging School", "Shop", "Book six weekly classes.", "puppy teach", true, 2),

      R("How to teach a puppy to sit", "Dog Help Hub", "Article", "A simple guide with pictures.", "puppy teach sit", false, 38, true),
      R("Teach a puppy to sit with treats", "Petwise", "Video", "Reward your puppy as soon as it sits.", "puppy teach sit", false, 9, true),
      R("Vet tips: teach your puppy to sit", "Vet Corner", "Video", "A vet shows the steps slowly.", "puppy teach sit", true, 8, true),
      R("Teach your puppy to sit and stay", "The Kennel Guide", "Article", "First lessons for a new puppy.", "puppy teach sit", true, 6, true),
      R("Puppy classes: we teach sit and stay", "Wagging School", "Shop", "Classes in your town from £12.", "puppy teach sit", true, 2),
      R("Find a trainer to teach your puppy to sit", "Trainer Finder", "Shop", "A list of dog trainers near you.", "puppy teach sit", true, 7),
      R("Teach a puppy to sit: common mistakes", "Dog Help Hub", "Video", "What to do if your puppy jumps up.", "puppy teach sit", false, 1, true),
      R("Advert: we teach your puppy to sit", "Wagging School", "Video", "A short advert for puppy classes.", "puppy teach sit", true, 4),
      R("Open day: watch us teach a puppy to sit", "Wagging School", "Video", "Come and visit our puppy school.", "puppy teach sit", true, 3),
      R("Dog show: can he teach his puppy to sit?", "ClipBarn", "Video", "A funny clip from a village show.", "puppy teach sit", true, 10)
    ];

    var on = {};
    var buttons = document.querySelectorAll("#sf-chips .ex-btn");
    var barEl = document.getElementById("sf-bar");
    var resultsEl = document.getElementById("sf-results");
    var lastShown = [];
    var lastAnswers = 0;      /* how many of the top results answered the question last time */
    var answers = 0;          /* how many of the top 4 answer the question now */
    var justAdded = false;    /* the last click switched a criterion on */

    function matches(r) {
      var words = " " + r.k + " ";
      if (on.puppy && words.indexOf(" puppy ") < 0) return false;
      if (on.teach && words.indexOf(" teach ") < 0) return false;
      if (on.sit && words.indexOf(" sit ") < 0) return false;
      if (on.uk && !r.uk) return false;
      if (on.video && r.type !== "Video") return false;
      if (on.recent && r.m > 12) return false;
      return true;
    }

    function ageText(m) {
      if (m < 12) return m === 1 ? "1 month ago" : m + " months ago";
      var y = Math.floor(m / 12);
      return y === 1 ? "1 year ago" : y + " years ago";
    }

    function countText() {
      var n = START_COUNT;
      ORDER.forEach(function (c) { if (on[c]) n = n / FACTOR[c]; });
      var mag = Math.pow(10, Math.floor(Math.log(n) / Math.LN10) - 1);
      n = Math.round(n / mag) * mag;
      return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    }

    function el(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }

    var SVG_NS = "http://www.w3.org/2000/svg";
    function svgEl(name, attrs) {
      var n = document.createElementNS(SVG_NS, name);
      Object.keys(attrs).forEach(function (k) { n.setAttribute(k, attrs[k]); });
      return n;
    }
    function tick() {
      var s = svgEl("svg", { "class": "sf-yes", viewBox: "0 0 26 26", "aria-hidden": "true" });
      s.appendChild(svgEl("circle", { cx: 13, cy: 13, r: 12, fill: "#15803D" }));
      s.appendChild(svgEl("path", { d: "M7.5 13.5l3.6 3.6 7.4-8", fill: "none", stroke: "#fff", "stroke-width": 3, "stroke-linecap": "round", "stroke-linejoin": "round" }));
      return s;
    }

    function render() {
      /* Search bar: the words, then any filters, then the count. */
      barEl.textContent = "";
      var glass = svgEl("svg", { width: 24, height: 24, viewBox: "0 0 24 24", "aria-hidden": "true" });
      glass.appendChild(svgEl("circle", { cx: 10, cy: 10, r: 6.5, fill: "none", stroke: "#6B7280", "stroke-width": 3 }));
      glass.appendChild(svgEl("path", { d: "M15 15l6 6", stroke: "#6B7280", "stroke-width": 3, "stroke-linecap": "round" }));
      barEl.appendChild(glass);
      barEl.appendChild(el("span", "sf-term", "dogs"));
      ["puppy", "teach", "sit", "uk"].forEach(function (k) {
        if (on[k]) barEl.appendChild(el("span", "sf-term added", BAR_TEXT[k]));
      });
      ["video", "recent"].forEach(function (k) {
        if (on[k]) barEl.appendChild(el("span", "sf-term filter", BAR_TEXT[k]));
      });
      barEl.appendChild(el("span", "sf-count", "About " + countText() + " results"));

      /* Top four results */
      var top = RESULTS.filter(matches).slice(0, 4);
      answers = 0;
      resultsEl.textContent = "";
      top.forEach(function (r) {
        if (r.ans) answers += 1;
        var card = el("div", "sf-card" + (r.ans ? " answers" : "") + (lastShown.indexOf(r) < 0 ? " new" : ""));
        card.appendChild(el("div", "sf-title", r.title));
        var meta = el("div", "sf-meta");
        meta.appendChild(el("span", "sf-type " + r.type.toLowerCase(), r.type));
        meta.appendChild(el("span", "sf-source", r.source));
        meta.appendChild(el("span", "", ageText(r.m)));
        card.appendChild(meta);
        card.appendChild(el("div", "sf-snip", r.snip));
        if (r.ans) {
          card.appendChild(tick());
          card.appendChild(el("span", "ex-visually-hidden", "Answers the question."));
        }
        resultsEl.appendChild(card);
      });
      lastShown = top;

      /* The one feedback line: the verdict. */
      if (answers === 4) {
        /* In the challenge, green only once a video filter is on too. */
        Explorer.status("These results answer the question.", (Explorer.step() === 1 || on.video) ? "good" : "");
      } else if (answers >= 2) {
        /* Adding a criterion can push good results out of the top four.
           That is not "closer", so say so. */
        Explorer.status((justAdded && answers < lastAnswers) ? "Some useful results went away." : "Getting closer.");
      } else {
        Explorer.status("Most results don’t answer the question.");
      }
      lastAnswers = answers;
      justAdded = false;

      for (var i = 0; i < buttons.length; i++) {
        buttons[i].setAttribute("aria-pressed", on[buttons[i].getAttribute("data-c")] ? "true" : "false");
      }
    }

    for (var b = 0; b < buttons.length; b++) {
      buttons[b].addEventListener("click", function () {
        var key = this.getAttribute("data-c");
        on[key] = !on[key];
        justAdded = !!on[key];
        render();
        Explorer.used();
      });
    }

    function good() { return answers === 4; }

    Explorer.setup({
      keyword: { word: "Criteria", meaning: "The words and filters you use to narrow a search." },
      /* Step 1: all four top results answer the question. */
      pulse: "#sf-chips .ex-btn",
      success: good,
      hint: "Add the words from the question.",
      hintAfter: 60,
      onReset: function () {
        on = {};
        lastShown = [];
        lastAnswers = 0;
        justAdded = false;
        render();
      },
      /* Step 2: Videos only is on and the results still answer it. */
      challenge: {
        text: "You want to watch how it’s done. Add one filter.",
        /* The words stay. Any filter already on is taken off, so there is
           one to add. */
        start: function () { on.video = false; on.recent = false; render(); },
        success: function () { return !!on.video && good(); },
        successText: "Every result is a video that answers it.",
        hint: "Try the filters on the right.",
        pulse: '#sf-chips [data-c="video"], #sf-chips [data-c="recent"]'
      }
    });

    render();
  })();
</script>
</body>
</html>
