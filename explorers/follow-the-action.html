<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Follow the action</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/explorer.css?v=3">
<style>
  /* Page-specific styles only. */
  .fa-box {
    flex: 0 1 auto;
    min-height: 0;
    width: 100%;
    max-width: 1240px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  #diagram { flex: 0 1 auto; height: auto; min-height: 0; width: 100%; display: block; }
  #diagram text { font-family: var(--font); font-weight: 800; fill: var(--text); }
  .zone rect { fill: #F9FAFB; stroke: var(--line-strong); stroke-width: 2; }
  .zone text { font-size: 15px; letter-spacing: 1.5px; fill: var(--accent) !important; }
  .wire { fill: none; stroke: var(--line-strong); stroke-width: 3; stroke-linejoin: round; }
  .trail { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
  .comp .box { fill: #fff; stroke: #9CA3AF; stroke-width: 2; transition: stroke 0.15s; }
  .comp .icon * { fill: none; stroke: var(--text); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .comp text { font-size: 17px; }
  .comp.big text { font-size: 20px; }
  .comp.lit .box { fill: #FDE68A; stroke: var(--accent); stroke-width: 4; }
  /* After an action has played, every part can be clicked. */
  .comp.can { cursor: pointer; outline: none; }
  .comp.can .box { stroke-dasharray: none; }
  .comp.can:hover .box, .comp.can:focus-visible .box { stroke: var(--accent); stroke-width: 4; }
  .comp.can:focus-visible .box { stroke-dasharray: 6 4; }
  .comp.picked .box { fill: var(--good-soft); stroke: var(--good); stroke-width: 5; }
  #dot-halo { fill: var(--accent); opacity: 0.25; }
  #dot-core { fill: var(--accent); stroke: #fff; stroke-width: 3; }

  .fa-actions { flex-shrink: 0; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }

  /* ----- Start screen demo: a ghost pointer picks an action, a dot travels ----- */
  .fa-d-box { position: absolute; top: 24px; width: 74px; height: 50px; border: 2px solid #9CA3AF; border-radius: 8px; background: #fff; font-size: 14px; font-weight: 800; text-align: center; line-height: 46px; }
  .fa-d-box.a { left: 18px; animation: fa-d-a 3.6s linear infinite; }
  .fa-d-box.b { left: 122px; animation: fa-d-b 3.6s linear infinite; }
  .fa-d-box.c { left: 226px; animation: fa-d-c 3.6s linear infinite; }
  .fa-d-wire { position: absolute; top: 48px; left: 92px; width: 134px; height: 3px; background: var(--line-strong); }
  .fa-d-dot { position: absolute; top: 42px; left: 49px; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: 3px solid #fff; box-shadow: 0 0 0 5px rgba(180, 83, 9, 0.25); opacity: 0; animation: fa-d-dot 3.6s linear infinite; }
  .fa-d-btn { position: absolute; left: 92px; top: 108px; width: 136px; height: 38px; line-height: 34px; text-align: center; font-size: 15px; font-weight: 800; border: 2px solid var(--line-strong); border-radius: 10px; background: #fff; animation: fa-d-btn 3.6s ease infinite; }
  .fa-d-move { position: absolute; left: 230px; top: 140px; animation: fa-d-move 3.6s ease-in-out infinite; }
  .fa-d-move .ex-ghost { left: 0; top: 0; }
  @keyframes fa-d-move { 0%, 6% { transform: translate(0, 0); } 22%, 90% { transform: translate(-28px, -12px); } 100% { transform: translate(0, 0); } }
  @keyframes fa-d-btn { 0%, 22% { background: #fff; color: var(--text); border-color: var(--line-strong); } 25%, 90% { background: var(--accent); color: #fff; border-color: var(--accent); } 95%, 100% { background: #fff; color: var(--text); border-color: var(--line-strong); } }
  @keyframes fa-d-dot { 0%, 25% { opacity: 0; transform: none; } 27% { opacity: 1; transform: none; } 50% { transform: translateX(104px); } 56% { transform: translateX(104px); } 80% { opacity: 1; transform: translateX(208px); } 90%, 100% { opacity: 0; transform: translateX(208px); } }
  @keyframes fa-d-a { 0%, 25% { background: #fff; } 27%, 90% { background: #FDE68A; } 95%, 100% { background: #fff; } }
  @keyframes fa-d-b { 0%, 49% { background: #fff; } 51%, 90% { background: #FDE68A; } 95%, 100% { background: #fff; } }
  @keyframes fa-d-c { 0%, 78% { background: #fff; } 80%, 90% { background: #FDE68A; } 95%, 100% { background: #fff; } }
  @media (prefers-reduced-motion: reduce) {
    /* A still frame: the action picked and every part on its path lit. */
    .fa-d-box, .fa-d-dot, .fa-d-btn, .fa-d-move { animation: none !important; }
    .fa-d-box { background: #FDE68A; }
    .fa-d-wire { background: var(--accent); }
    .fa-d-btn { background: var(--accent); color: #fff; border-color: var(--accent); }
    .fa-d-move { transform: translate(-28px, -12px); }
  }

  @media (max-width: 1100px), (max-height: 620px) {
    .fa-box { gap: 8px; }
    .fa-actions { gap: 8px; }
    .fa-actions .ex-btn { padding: 4px 12px; min-height: 42px; }
  }
</style>
</head>
<body class="unit-4 ex-v2">

<!-- SCREEN 1: Start -->
<section class="ex-screen ex-start" id="ex-start">
  <h1>Follow the action</h1>
  <p class="ex-why">Every action uses input, process, output and storage.</p>
  <div class="ex-demo" aria-hidden="true">
    <span class="fa-d-wire"></span>
    <span class="fa-d-box a">Input</span>
    <span class="fa-d-box b">CPU</span>
    <span class="fa-d-box c">Output</span>
    <span class="fa-d-dot"></span>
    <span class="fa-d-btn">Type a letter</span>
    <span class="fa-d-move">
      <svg class="ex-ghost" viewBox="0 0 24 24"><path d="M5 2l14 11h-7.2l4 7.6-3 1.6-4-7.7L5 19z"/></svg>
    </span>
  </div>
  <p class="ex-how">Pick an action.</p>
  <button type="button" class="ex-btn primary big" id="ex-go">Start</button>
</section>

<!-- SCREEN 2: Explore -->
<section class="ex-screen" id="ex-explore" hidden>
  <div class="ex-top">
    <span class="ex-steps" id="ex-steps" aria-hidden="true"><i></i><i></i></span>
    <p class="ex-instruction" id="ex-instruction">Take a photo. Then click the part that does the processing.</p>
    <button type="button" class="ex-quiet" id="ex-reset">Start again</button>
  </div>
  <div class="ex-area">
    <div class="fa-box">
      <svg id="diagram" viewBox="0 0 1100 238" preserveAspectRatio="xMidYMid meet" role="group"
           aria-label="Diagram of a computer system. Input: keyboard, mouse, camera, microphone. Process: CPU and memory (RAM). Output: speakers, screen, printer. Storage: SSD."></svg>
      <div class="fa-actions" id="fa-actions" role="group" aria-label="Actions">
        <button type="button" class="ex-btn" data-action="type" aria-pressed="false">Type a letter</button>
        <button type="button" class="ex-btn" data-action="photo" aria-pressed="false">Take a photo</button>
        <button type="button" class="ex-btn" data-action="print" aria-pressed="false">Print a saved file</button>
        <button type="button" class="ex-btn" data-action="song" aria-pressed="false">Play a saved song</button>
        <button type="button" class="ex-btn" data-action="voice" aria-pressed="false">Record your voice</button>
      </div>
    </div>
    <p class="ex-status" id="ex-status" role="status"></p>
  </div>
</section>

<script src="shared/explorer.js?v=3"></script>
<script>
  (function () {
    "use strict";

    /* KS3-level model, kept simple on purpose:
       the CPU processes, RAM holds what is being worked on,
       storage (SSD) keeps files when the power is off. */

    var NS = "http://www.w3.org/2000/svg";
    var svg = document.getElementById("diagram");
    var buttons = Array.prototype.slice.call(document.querySelectorAll("#fa-actions .ex-btn"));
    var reduced = window.matchMedia("(prefers-reduced-motion: reduce)");

    var ICONS = {
      keyboard: '<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.5M10 10h.5M14 10h.5M18 10h.5M7 14h10"/>',
      mouse: '<rect x="7" y="3" width="10" height="18" rx="5"/><path d="M12 6.5v3.5"/>',
      camera: '<rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.5"/><path d="M8 7l1.5-3h5L16 7"/>',
      microphone: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M9 21h6"/>',
      cpu: '<rect x="6" y="6" width="12" height="12" rx="1.5"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/>',
      ram: '<rect x="2" y="7" width="20" height="9" rx="1"/><path d="M6 10v3M10 10v3M14 10v3M18 10v3M4 16v3M8 16v3M12 16v3M16 16v3M20 16v3"/>',
      screen: '<rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M12 16v4M8 20h8"/>',
      speakers: '<rect x="6" y="3" width="12" height="18" rx="2"/><circle cx="12" cy="14" r="3"/><circle cx="12" cy="7.5" r="0.8"/>',
      printer: '<path d="M7 9V4h10v5"/><rect x="3" y="9" width="18" height="8" rx="2"/><rect x="7" y="14" width="10" height="6"/>',
      ssd: '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 12.5h5"/><circle cx="16" cy="16" r="0.8"/>'
    };

    var ZONES = [
      { x: 10,  w: 240, label: "INPUT" },
      { x: 290, w: 350, label: "PROCESS" },
      { x: 690, w: 210, label: "OUTPUT" },
      { x: 930, w: 160, label: "STORAGE" }
    ];

    /* layout "row": icon left, label right. layout "stack": icon on top, label under. */
    var COMPS = {
      keyboard:   { x: 20,  y: 36,  w: 220, h: 38, label: "Keyboard",     layout: "row" },
      mouse:      { x: 20,  y: 80,  w: 220, h: 38, label: "Mouse",        layout: "row" },
      camera:     { x: 20,  y: 124, w: 220, h: 38, label: "Camera",       layout: "row" },
      microphone: { x: 20,  y: 168, w: 220, h: 38, label: "Microphone",   layout: "row" },
      cpu:        { x: 500, y: 46,  w: 128, h: 76, label: "CPU",          layout: "stack", big: true },
      ram:        { x: 300, y: 160, w: 176, h: 44, label: "Memory (RAM)", layout: "row" },
      speakers:   { x: 700, y: 40,  w: 190, h: 46, label: "Speakers",     layout: "row" },
      screen:     { x: 700, y: 96,  w: 190, h: 46, label: "Screen",       layout: "row" },
      printer:    { x: 700, y: 152, w: 190, h: 46, label: "Printer",      layout: "row" },
      ssd:        { x: 945, y: 87,  w: 130, h: 64, label: "SSD",          layout: "stack" }
    };

    /* Wires: every connection drawn in grey. Key is "from>to". */
    var WIRES = {
      "keyboard>cpu":   "M240,55 H270 V84 H500",
      "mouse>cpu":      "M240,99 H270 V84 H500",
      "camera>cpu":     "M240,143 H270 V84 H500",
      "microphone>cpu": "M240,187 H270 V84 H500",
      "cpu>speakers":   "M628,84 H665 V63 H700",
      "cpu>screen":     "M628,84 H665 V119 H700",
      "cpu>printer":    "M628,84 H665 V175 H700",
      "ssd>ram":        "M1040,151 V230 H388 V204",
      "ram>cpu":        "M476,182 H540 V122",
      "cpu>ssd":        "M596,122 V221 H985 V151"
    };

    /* steps: the one status line shows each step as the dot reaches it. */
    var ACTIONS = {
      type:  { path: ["keyboard", "cpu", "screen"],
               steps: ["Keyboard (input)", "CPU (process)", "Screen (output)"] },
      photo: { path: ["camera", "cpu", "screen", "ssd"],
               /* The CPU sends the photo to the screen and to the SSD,
                  so the last leg starts at the CPU, not the screen. */
               from: [null, "camera", "cpu", "cpu"],
               steps: ["Camera (input)", "CPU (process)", "Screen (output)", "SSD (storage)"] },
      print: { path: ["ssd", "ram", "cpu", "printer"], storageFirst: true,
               steps: ["SSD (storage)", "RAM holds the file", "CPU (process)", "Printer (output)"] },
      song:  { path: ["ssd", "ram", "cpu", "speakers"], storageFirst: true,
               steps: ["SSD (storage)", "RAM holds the song", "CPU (process)", "Speakers (output)"] },
      voice: { path: ["microphone", "cpu", "ssd"],
               steps: ["Microphone (input)", "CPU (process)", "SSD (storage)"] }
    };

    function el(name, attrs, html) {
      var node = document.createElementNS(NS, name);
      Object.keys(attrs || {}).forEach(function (k) { node.setAttribute(k, attrs[k]); });
      if (html) node.innerHTML = html;
      return node;
    }

    /* ---------- Build the diagram ---------- */
    var compEls = {};
    var trailLayer, dot;

    function build() {
      ZONES.forEach(function (z) {
        var g = el("g", { "class": "zone", "aria-hidden": "true" });
        g.appendChild(el("rect", { x: z.x, y: 6, width: z.w, height: 206, rx: 12 }));
        var t = el("text", { x: z.x + z.w / 2, y: 27, "text-anchor": "middle" });
        t.textContent = z.label;
        g.appendChild(t);
        svg.appendChild(g);
      });

      var wires = el("g", { "aria-hidden": "true" });
      Object.keys(WIRES).forEach(function (k) {
        wires.appendChild(el("path", { "class": "wire", d: WIRES[k] }));
      });
      svg.appendChild(wires);

      trailLayer = el("g", { "aria-hidden": "true" });
      svg.appendChild(trailLayer);

      Object.keys(COMPS).forEach(function (id) {
        var c = COMPS[id];
        var g = el("g", { "class": "comp" + (c.big ? " big" : ""), "data-comp": id, "aria-label": c.label });
        g.appendChild(el("rect", { "class": "box", x: c.x, y: c.y, width: c.w, height: c.h, rx: 10 }));
        var text;
        if (c.layout === "row") {
          g.appendChild(el("g", { "class": "icon", transform: "translate(" + (c.x + 12) + "," + (c.y + c.h / 2 - 13) + ") scale(1.08)" }, ICONS[id]));
          text = el("text", { x: c.x + 48, y: c.y + c.h / 2 + 6 });
        } else {
          var s = c.big ? 1.5 : 1.2;
          g.appendChild(el("g", { "class": "icon", transform: "translate(" + (c.x + c.w / 2 - 12 * s) + "," + (c.y + 6) + ") scale(" + s + ")" }, ICONS[id]));
          text = el("text", { x: c.x + c.w / 2, y: c.y + c.h - 9, "text-anchor": "middle" });
        }
        text.textContent = c.label;
        g.appendChild(text);
        g.addEventListener("click", function () { pickPart(id); });
        g.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pickPart(id); }
        });
        svg.appendChild(g);
        compEls[id] = g;
      });

      dot = el("g", { visibility: "hidden", "aria-hidden": "true" });
      dot.appendChild(el("circle", { id: "dot-halo", r: 15 }));
      dot.appendChild(el("circle", { id: "dot-core", r: 8 }));
      svg.appendChild(dot);
    }

    /* ---------- State ---------- */
    var runId = 0;
    var current = "";        /* the action picked last */
    var played = false;      /* an action has finished playing (parts can be clicked) */
    var photoPlayed = false; /* "Take a photo" has played at least once */
    var picked = "";         /* the part clicked */
    var storageDone = false; /* challenge: an action that starts with storage has played */

    function setClickable(on) {
      Object.keys(compEls).forEach(function (id) {
        var g = compEls[id];
        g.classList.toggle("can", on);
        if (on) { g.setAttribute("role", "button"); g.setAttribute("tabindex", "0"); }
        else { g.removeAttribute("role"); g.removeAttribute("tabindex"); }
      });
    }

    function clearAll() {
      runId += 1;
      Object.keys(compEls).forEach(function (id) { compEls[id].classList.remove("lit"); });
      while (trailLayer.firstChild) trailLayer.removeChild(trailLayer.firstChild);
      dot.setAttribute("visibility", "hidden");
    }

    function arrive(action, i) {
      compEls[action.path[i]].classList.add("lit");
      Explorer.status("Step " + (i + 1) + ": " + action.steps[i]);
    }

    function makeTrail(from, to) {
      var p = el("path", { "class": "trail", d: WIRES[from + ">" + to] });
      trailLayer.appendChild(p);
      return p;
    }

    /* Where leg i starts. Usually the part before it in the path. */
    function legStart(action, i) {
      return action.from ? action.from[i] : action.path[i - 1];
    }

    /* The action has finished playing. */
    function done(key) {
      if (key === "photo") photoPlayed = true;
      if (ACTIONS[key].storageFirst) storageDone = true;
      if (!played) { played = true; }
      setClickable(Explorer.step() === 1);
      Explorer.used();
    }

    function run(key) {
      var action = ACTIONS[key];
      clearAll();
      var myRun = runId;

      if (reduced.matches) {
        action.path.forEach(function (id, i) {
          compEls[id].classList.add("lit");
          if (i > 0) makeTrail(legStart(action, i), id);
        });
        Explorer.status(action.steps.map(function (s, i) { return (i + 1) + " " + s; }).join(", "));
        done(key);
        return;
      }

      var SPEED = 520;  /* diagram units per second */
      var PAUSE = 420;  /* ms the dot waits at each part */

      function leg(i) {
        if (myRun !== runId) return;
        if (i >= action.path.length) {
          dot.setAttribute("visibility", "hidden");
          done(key);
          return;
        }
        var path = makeTrail(legStart(action, i), action.path[i]);
        var len = path.getTotalLength();
        var duration = Math.max(350, len / SPEED * 1000);
        var start = null;
        path.setAttribute("stroke-dasharray", len + " " + len);
        path.setAttribute("stroke-dashoffset", len);
        dot.setAttribute("visibility", "visible");

        function frame(now) {
          if (myRun !== runId) return;
          if (start === null) start = now;
          var t = Math.min(1, (now - start) / duration);
          var pt = path.getPointAtLength(len * t);
          dot.setAttribute("transform", "translate(" + pt.x + "," + pt.y + ")");
          path.setAttribute("stroke-dashoffset", len * (1 - t));
          if (t < 1) {
            requestAnimationFrame(frame);
          } else {
            path.removeAttribute("stroke-dasharray");
            path.removeAttribute("stroke-dashoffset");
            arrive(action, i);
            setTimeout(function () { leg(i + 1); }, PAUSE);
          }
        }
        requestAnimationFrame(frame);
      }

      arrive(action, 0);
      setTimeout(function () { leg(1); }, PAUSE);
    }

    function pickAction(key) {
      current = key;
      picked = "";   /* the part is clicked after the action, not before */
      Object.keys(compEls).forEach(function (k) { compEls[k].classList.remove("picked"); });
      buttons.forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-action") === key ? "true" : "false"); });
      run(key);
      Explorer.used();   /* stops the pulse straight away */
    }

    buttons.forEach(function (btn) {
      btn.addEventListener("click", function () { pickAction(btn.getAttribute("data-action")); });
    });

    /* Step 1: click a part once an action has played. */
    function pickPart(id) {
      if (!played || Explorer.step() !== 1) return;
      Object.keys(compEls).forEach(function (k) { compEls[k].classList.remove("picked"); });
      if (id === "cpu") {
        picked = "cpu";
        compEls.cpu.classList.add("picked");
        if (!photoPlayed) Explorer.hint("Now pick Take a photo.");
        Explorer.used();
        return;
      }
      picked = "";
      Explorer.hint("That part is not the processor. Watch the dot again.");
      run(current);
    }

    function reset() {
      buttons.forEach(function (b) { b.setAttribute("aria-pressed", "false"); });
      Object.keys(compEls).forEach(function (k) { compEls[k].classList.remove("picked"); });
      clearAll();
      current = "";
      played = false;
      photoPlayed = false;
      picked = "";
      storageDone = false;
      setClickable(false);
      Explorer.status("");
    }

    build();

    Explorer.setup({
      keyword: { word: "Process", meaning: "What the CPU does to information." },
      /* Step 1: Take a photo has played and the CPU has been clicked. */
      pulse: "#fa-actions .ex-btn",
      success: function () { return photoPlayed && picked === "cpu"; },
      successText: "The CPU does the processing.",
      hint: "Look for the part in the middle.",
      hintAfter: 60,
      onReset: reset,
      /* Step 2: an action that starts with storage has played. */
      challenge: {
        text: "Find an action that starts with storage.",
        start: function () {
          storageDone = false;
          setClickable(false);
          Object.keys(compEls).forEach(function (k) { compEls[k].classList.remove("picked"); });
        },
        success: function () { return storageDone; },
        successText: "It starts at the SSD, where files are kept.",
        hint: "Look for the word saved.",
        pulse: "#fa-actions .ex-btn"
      }
    });

    reset();
  })();
</script>
</body>
</html>
