<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PNG or JPG?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/explorer.css?v=6">
<style>
  /* Page-specific styles only. */
  body { --hint: #6D28D9; }   /* the pink accent reads like an error, so hints are purple */

  .ft-row { display: flex; justify-content: center; align-items: center; gap: 32px; flex: 1 1 0px; min-height: 0; }
  .ft-poster { display: block; border-radius: 8px; border: 2px solid var(--line-strong); }

  .ft-tray { display: flex; flex-direction: column; gap: 14px; }
  .ft-traycap { font-size: 16px; font-weight: 800; color: var(--muted); }
  .ft-key { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 800; color: var(--text); margin-top: -6px; }
  .ft-key i { width: 22px; height: 22px; border: 1px solid var(--line-strong); border-radius: 3px;
    background: conic-gradient(#C9CDD4 25%, #fff 0 50%, #C9CDD4 0 75%, #fff 0) 0 0 / 11px 11px; }
  .ft-file {
    display: flex; align-items: center; gap: 14px;
    padding: 8px 16px 8px 8px;
    background: #fff; border: 3px solid var(--line-strong); border-radius: 12px;
    font: inherit; font-size: 22px; font-weight: 800; color: var(--text);
    cursor: pointer; text-align: left;
  }
  .ft-file:hover { border-color: var(--text); }
  .ft-file:focus-visible { outline: 4px solid var(--accent); outline-offset: 3px; }
  .ft-file.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent); }
  .ft-file[hidden] { display: none; }
  .ft-file canvas { display: block; width: 84px; height: 84px; border-radius: 6px; border: 1px solid var(--line); }

  /* The two answer buttons for the challenge live in the instruction row. */
  .ft-answers { display: flex; gap: 12px; flex-shrink: 0; }
  .ft-answers[hidden] { display: none; }
  .ft-answers .ex-btn { min-width: 84px; }

  /* ----- Start screen demo: a picture lands on a poster, box then no box ----- */
  .ft-d-poster { position: absolute; left: 70px; top: 10px; width: 200px; height: 140px; border-radius: 8px;
    background: linear-gradient(180deg, #1E1B4B, #7C3AED 60%, #F472B6); }
  .ft-d-pic { position: absolute; left: 150px; top: 60px; width: 60px; height: 60px; border-radius: 4px; background: #fff;
    animation: ft-d-box 4s ease-in-out infinite; }
  .ft-d-pic::after { content: ""; position: absolute; left: 10px; top: 18px; width: 40px; height: 24px; border-radius: 12px; background: #22D3EE; border: 3px solid #0F172A; box-sizing: border-box; }
  .ft-d-pic .ex-ghost { left: 40px; top: 44px; }
  @keyframes ft-d-box { 0%, 45% { background: #fff; } 55%, 100% { background: transparent; } }
  @media (prefers-reduced-motion: reduce) { .ft-d-pic { animation: none; background: transparent; } }

  @media (max-width: 1100px), (max-height: 620px) {
    .ft-row { gap: 20px; }
    .ft-tray { gap: 10px; }
    .ft-file { font-size: 19px; padding: 6px 12px 6px 6px; }
    .ft-file canvas { width: 66px; height: 66px; }
  }
</style>
</head>
<body class="unit-2 ex-v2">

<!-- SCREEN 1: Start -->
<section class="ex-screen ex-start" id="ex-start">
  <h1>PNG or JPG?</h1>
  <p class="ex-why">The file type decides if your picture has a box round it.</p>
  <div class="ex-demo" aria-hidden="true">
    <span class="ft-d-poster"></span>
    <span class="ft-d-pic">
      <svg class="ex-ghost" viewBox="0 0 24 24"><path d="M5 2l14 11h-7.2l4 7.6-3 1.6-4-7.7L5 19z"/></svg>
    </span>
  </div>
  <p class="ex-how">Click a file.</p>
  <button type="button" class="ex-btn primary big" id="ex-go">Start</button>
</section>

<!-- SCREEN 2: Explore -->
<section class="ex-screen" id="ex-explore" hidden>
  <div class="ex-top">
    <span class="ex-steps" id="ex-steps" aria-hidden="true"><i></i><i></i></span>
    <p class="ex-instruction" id="ex-instruction">Put the controller on the poster with no box round it.</p>
    <div class="ft-answers" id="ft-answers" hidden>
      <button type="button" class="ex-btn" data-answer="yes">Yes</button>
      <button type="button" class="ex-btn" data-answer="no">No</button>
    </div>
    <button type="button" class="ex-quiet" id="ex-reset">Start again</button>
  </div>
  <div class="ex-area" id="ft-area">
    <div class="ft-row">
      <canvas class="ft-poster" id="ft-poster" role="img" aria-label="The Games Club poster."></canvas>
      <div class="ft-tray" id="ft-tray">
        <span class="ft-traycap">Your files</span>
        <span class="ft-key"><i aria-hidden="true"></i>Squares mean see-through</span>
        <button type="button" class="ft-file" data-file="png"><canvas width="168" height="168"></canvas>controller.png</button>
        <button type="button" class="ft-file" data-file="jpg"><canvas width="168" height="168"></canvas>controller.jpg</button>
        <button type="button" class="ft-file" data-file="fake" hidden><canvas width="168" height="168"></canvas>web-download.png</button>
      </div>
    </div>
    <p class="ex-status" id="ex-status" role="status"></p>
  </div>
</section>

<script src="shared/explorer.js?v=6"></script>
<script>
  (function () {
    "use strict";

    /* How this page stays honest:
       - controller.png keeps real see-through pixels round the picture.
       - controller.jpg is the same picture on white, because JPG cannot store
         see-through pixels (exporters fill them with white).
       - web-download.png is the same picture with a checkerboard painted in.
         The squares are real pixels, so it looks see-through in the file list
         but is not. This is common on "free PNG" websites.
       - In the file list, real see-through is shown with a checkerboard, as
         Canva and other editors do. On the poster, see-through shows the poster. */
    var SRC_W = 640, SRC_H = 480;
    var PIC = 240;                                  // picture canvas size
    var SPOT = { x: 360, y: 200, s: 240 };          // where the picture lands on the poster
    var FONT_STACK = '"Arial Rounded MT Bold", "Arial Rounded MT", "Nunito", Arial, sans-serif';

    var area = document.getElementById("ft-area");
    var statusEl = document.getElementById("ex-status");
    var poster = document.getElementById("ft-poster");
    var tray = document.getElementById("ft-tray");
    var files = tray.querySelectorAll("[data-file]");
    var fakeBtn = tray.querySelector('[data-file="fake"]');
    var answers = document.getElementById("ft-answers");
    var answerBtns = answers.querySelectorAll("[data-answer]");

    var versions = {};       // png, jpg, fake: canvases of the picture
    var placed = "";         // which file is on the poster
    var triedJpg = false;
    var inChallenge = false;
    var answer = "";
    var view = { w: 480, h: 360 };

    function checker(ctx, w, h, cell) {
      ctx.fillStyle = "#FFFFFF";
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "#C9CDD4";
      for (var y = 0; y * cell < h; y++) {
        for (var x = (y % 2); x * cell < w; x += 2) ctx.fillRect(x * cell, y * cell, cell, cell);
      }
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
    }

    /* An original game controller, drawn on a see-through canvas. */
    function drawController(ctx) {
      ctx.save();
      ctx.lineJoin = "round";
      // Body with two grips.
      ctx.fillStyle = "#22D3EE";
      ctx.strokeStyle = "#0F172A";
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(60, 70);
      ctx.lineTo(180, 70);
      ctx.bezierCurveTo(222, 70, 236, 120, 230, 170);
      ctx.bezierCurveTo(225, 205, 192, 210, 176, 180);
      ctx.lineTo(160, 150);
      ctx.lineTo(80, 150);
      ctx.lineTo(64, 180);
      ctx.bezierCurveTo(48, 210, 15, 205, 10, 170);
      ctx.bezierCurveTo(4, 120, 18, 70, 60, 70);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      // D-pad.
      ctx.fillStyle = "#0F172A";
      ctx.fillRect(52, 96, 16, 46);
      ctx.fillRect(37, 111, 46, 16);
      // Four buttons.
      [["#F43F5E", 180, 100], ["#FACC15", 200, 120], ["#22C55E", 160, 120], ["#6366F1", 180, 140]].forEach(function (b) {
        ctx.fillStyle = b[0];
        ctx.beginPath(); ctx.arc(b[1], b[2], 10, 0, Math.PI * 2); ctx.fill();
        ctx.lineWidth = 3; ctx.stroke();
      });
      // Two small middle buttons.
      ctx.fillStyle = "#0F172A";
      roundRect(ctx, 100, 98, 14, 8, 4); ctx.fill();
      roundRect(ctx, 126, 98, 14, 8, 4); ctx.fill();
      ctx.restore();
    }

    function makeVersions() {
      var cut = document.createElement("canvas");
      cut.width = PIC; cut.height = PIC;
      drawController(cut.getContext("2d"));
      versions.png = cut;

      var jpg = document.createElement("canvas");
      jpg.width = PIC; jpg.height = PIC;
      var j = jpg.getContext("2d");
      j.fillStyle = "#FFFFFF"; j.fillRect(0, 0, PIC, PIC);
      j.drawImage(cut, 0, 0);
      versions.jpg = jpg;

      var fake = document.createElement("canvas");
      fake.width = PIC; fake.height = PIC;
      var f = fake.getContext("2d");
      checker(f, PIC, PIC, 20);            // painted in: these are real pixels
      f.drawImage(cut, 0, 0);
      versions.fake = fake;

      // File list thumbnails. Real see-through shows as a checkerboard here.
      for (var i = 0; i < files.length; i++) {
        var key = files[i].getAttribute("data-file");
        var c = files[i].querySelector("canvas");
        var ctx = c.getContext("2d");
        if (key === "png") checker(ctx, c.width, c.height, 14);
        else { ctx.clearRect(0, 0, c.width, c.height); }
        ctx.drawImage(versions[key], 0, 0, PIC, PIC, 0, 0, c.width, c.height);
      }
    }

    function drawPoster() {
      var dpr = window.devicePixelRatio || 1;
      var w = Math.round(view.w * dpr), h = Math.round(view.h * dpr);
      if (poster.width !== w || poster.height !== h) { poster.width = w; poster.height = h; }
      var ctx = poster.getContext("2d");
      ctx.setTransform(w / SRC_W, 0, 0, h / SRC_H, 0, 0);

      var sky = ctx.createLinearGradient(0, 0, 0, SRC_H);
      sky.addColorStop(0, "#1E1B4B");
      sky.addColorStop(0.55, "#7C3AED");
      sky.addColorStop(1, "#F472B6");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, SRC_W, SRC_H);

      ctx.fillStyle = "#FFFFFF";
      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
      ctx.font = "800 84px " + FONT_STACK;
      ctx.fillText("GAMES", 40, 120);
      ctx.fillText("CLUB", 40, 205);
      ctx.font = "700 30px " + FONT_STACK;
      ctx.fillText("Thursday lunchtime", 40, 300);
      ctx.fillText("Room 4", 40, 345);

      if (placed) ctx.drawImage(versions[placed], SPOT.x, SPOT.y, SPOT.s, SPOT.s);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    }

    function layout() {
      if (!area.clientHeight) return;   /* the Explore screen is not showing */
      var cs = getComputedStyle(area);
      var innerH = area.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
      var innerW = area.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      var areaGap = parseFloat(cs.rowGap) || 10;
      var rowGap = parseFloat(getComputedStyle(area.querySelector(".ft-row")).columnGap) || 32;
      var h = Math.floor(innerH - statusEl.offsetHeight - areaGap - 8);
      h = Math.max(160, Math.min(480, h));
      var w = Math.round(h * 4 / 3);
      var maxW = Math.floor(innerW - tray.offsetWidth - rowGap - 8);
      if (w > maxW) { w = maxW; h = Math.round(w * 3 / 4); }
      view = { w: w, h: h };
      poster.style.width = w + "px";
      poster.style.height = h + "px";
    }

    function refresh() { layout(); drawPoster(); }

    function mark() {
      for (var i = 0; i < files.length; i++) {
        files[i].classList.toggle("on", files[i].getAttribute("data-file") === placed);
      }
    }

    for (var i = 0; i < files.length; i++) {
      files[i].addEventListener("click", function () {
        placed = this.getAttribute("data-file");
        if (placed === "jpg") triedJpg = true;
        mark();
        drawPoster();
        if (placed === "jpg") Explorer.status("JPG has no see-through, so it brings a white box.");
        else if (placed === "png") Explorer.status("PNG keeps the see-through part.");
        if (placed === "fake") {
          if (answer === "no") Explorer.status("The squares are painted in. It only looked see-through.", "good");
          else { answers.hidden = false; Explorer.status("Is it really see-through?"); }
        }
        Explorer.answer();        // stops the pulse and checks for success
      });
    }

    for (var k = 0; k < answerBtns.length; k++) {
      answerBtns[k].addEventListener("click", function () {
        var a = this.getAttribute("data-answer");
        if (a === "no") {
          answer = "no";
          answers.hidden = true;     // makes room for "I'm finished" in the same row
          Explorer.answer();
        } else {
          Explorer.answer();
          Explorer.hint("Look at the poster round the controller.");
        }
      });
    }

    function resetAll() {
      placed = "";
      triedJpg = false;
      inChallenge = false;
      answer = "";
      answers.hidden = true;
      fakeBtn.hidden = true;
      for (var i = 0; i < files.length; i++) files[i].hidden = files[i] === fakeBtn;
      mark();
      refresh();
      Explorer.status("");
    }

    Explorer.setup({
      keyword: { word: "Export", meaning: "Save your design as a file to use somewhere else.", tile: "shared/tiles/export.png" },
      bridge: { title: "Later, in Canva", img: "shared/canva/download-filetype.png", imgW: 818, imgH: 155, crop: [0, 818], focus: [18, 778], alt: "Canva Download panel with the File type box ringed", text: "Click Share. Click Download. Pick PNG." },
      /* Step 1: the real PNG is on the poster. */
      pulse: ".ft-file",
      success: function () { return !inChallenge && placed === "png"; },
      successText: "No box. PNG can be see-through. JPG cannot.",
      hint: function () { return triedJpg ? "Try the other file." : "Try each file."; },
      hintAfter: 45,
      onShow: refresh,
      onReset: resetAll,
      /* Step 2: spot the fake see-through from the internet. */
      challenge: {
        text: "This one came from a website. Put it on the poster.",
        start: function () {
          inChallenge = true;
          placed = "";
          answer = "";
          for (var i = 0; i < files.length; i++) files[i].hidden = files[i] !== fakeBtn;
          fakeBtn.hidden = false;
          mark();
          refresh();
          Explorer.status("");
        },
        success: function () { return answer === "no"; },
        successText: "The squares are painted in. It only looked see-through.",
        hint: "Click the file, then look at the poster.",
        pulse: ".ft-file:not([hidden])"
      }
    });

    if (window.ResizeObserver) new ResizeObserver(refresh).observe(area);
    else window.addEventListener("resize", refresh);

    makeVersions();
    refresh();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(refresh);
  })();
</script>
</body>
</html>
