<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resolution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/explorer.css?v=5">
<style>
  /* Page-specific styles only. */
  body { --hint: #6D28D9; }   /* hints in purple, so they never look like an error */

  #rz-big { display: block; flex-shrink: 0; border-radius: 6px; background: #17365D; }
  /* The slider sits right under the poster it changes, the same width. */
  .ex-v2 input[type="range"].ex-slider.rz-slider { flex-shrink: 0; margin: 6px 0 2px; }

  /* Yes / No answers for the challenge, in the instruction row. */
  .rz-answers { display: flex; gap: 10px; flex-shrink: 0; }
  .rz-answers[hidden] { display: none; }
  .rz-answers .ex-btn { min-width: 84px; }

  /* ----- Start screen demo: slide right, the blocky poster turns sharp ----- */
  .rz-d-pic { position: absolute; left: 100px; top: 14px; width: 120px; height: 90px; border-radius: 4px; image-rendering: pixelated; }
  .rz-d-pic.sharp { animation: rz-d-sharp 3.4s ease-in-out infinite; }
  .rz-d-track { position: absolute; left: 60px; right: 60px; top: 128px; height: 12px; border-radius: 999px; background: var(--line); }
  .rz-d-thumb { position: absolute; left: 50px; top: 119px; width: 30px; height: 30px; border-radius: 50%; background: var(--accent); border: 4px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.3); animation: rz-d-thumb 3.4s ease-in-out infinite; }
  .rz-d-thumb .ex-ghost { left: 8px; top: 10px; }
  .rz-d-arrow { display: none; }
  @keyframes rz-d-thumb { 0%, 15% { transform: none; } 60%, 88% { transform: translateX(170px); } 100% { transform: none; } }
  @keyframes rz-d-sharp { 0%, 35% { opacity: 0; } 60%, 88% { opacity: 1; } 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .rz-d-thumb, .rz-d-pic.sharp { animation: none !important; }
    .rz-d-pic.sharp { opacity: 0; }
    .rz-d-arrow { display: block; position: absolute; left: 96px; top: 160px; width: 120px; height: 4px; background: var(--accent); }
    .rz-d-arrow::after { content: ""; position: absolute; right: -12px; top: -8px; border: 10px solid transparent; border-right: 0; border-left: 14px solid var(--accent); }
  }
</style>
</head>
<body class="unit-2 ex-v2">

<!-- SCREEN 1: Start -->
<section class="ex-screen ex-start" id="ex-start">
  <h1>Resolution</h1>
  <p class="ex-why">Too few pixels make your photos look blocky.</p>
  <div class="ex-demo" aria-hidden="true">
    <canvas class="rz-d-pic" id="rz-d-low"></canvas>
    <canvas class="rz-d-pic sharp" id="rz-d-high"></canvas>
    <span class="rz-d-track"></span>
    <span class="rz-d-arrow"></span>
    <span class="rz-d-thumb">
      <svg class="ex-ghost" viewBox="0 0 24 24"><path d="M5 2l14 11h-7.2l4 7.6-3 1.6-4-7.7L5 19z"/></svg>
    </span>
  </div>
  <p class="ex-how">Move the slider.</p>
  <button type="button" class="ex-btn primary big" id="ex-go">Start</button>
</section>

<!-- SCREEN 2: Explore -->
<section class="ex-screen" id="ex-explore" hidden>
  <div class="ex-top">
    <span class="ex-steps" id="ex-steps" aria-hidden="true"><i></i><i></i></span>
    <p class="ex-instruction" id="ex-instruction">Find the fewest pixels where you can read every word.</p>
    <div class="rz-answers" id="rz-answers" hidden>
      <button type="button" class="ex-btn" id="rz-yes">Yes</button>
      <button type="button" class="ex-btn" id="rz-no">No</button>
    </div>
    <button type="button" class="ex-quiet" id="ex-reset">Start again</button>
  </div>
  <div class="ex-area" id="rz-area">
    <canvas id="rz-big" role="img" aria-label="A poster."></canvas>
    <input class="ex-slider rz-slider" type="range" id="rz-slider" min="0" max="12" step="1" value="0" aria-label="Pixels across">
    <p class="ex-status" id="ex-status" role="status"></p>
  </div>
</section>

<script src="shared/explorer.js?v=5"></script>
<script>
  (function () {
    "use strict";

    /* The poster is drawn once at 1536 x 1152 (4:3). Every slider step divides
       1536 exactly, so each low-resolution pixel is a true average of a whole
       square of the original (a box filter). Nothing is faked: the picture on
       screen is the real N-pixel-wide image, drawn back up with smoothing off. */
    var SRC_W = 1536, SRC_H = 1152;
    var STEPS = [8, 12, 16, 24, 32, 48, 64, 96, 128, 192, 256, 384, 512];
    var START_INDEX = 0;
    var CLEAR = 128;             /* the fewest pixels where every word is clear (checked by eye) */
    var LOW = 64;                /* step 1 also needs the pupil to have seen it blurry */
    var FONT_STACK = '"Arial Rounded MT Bold", "Arial Rounded MT", "Nunito", Arial, sans-serif';

    var area = document.getElementById("rz-area");
    var big = document.getElementById("rz-big");
    var slider = document.getElementById("rz-slider");
    var statusEl = document.getElementById("ex-status");
    var answers = document.getElementById("rz-answers");
    var yesBtn = document.getElementById("rz-yes");
    var noBtn = document.getElementById("rz-no");

    var srcData = null;      // Uint8ClampedArray of the full-size poster
    var cache = {};          // N -> small canvas holding the N-pixel-wide image
    var lastIndex = START_INDEX;
    var view = { w: 0, h: 0 };
    var beenLow = false;
    var sizes = {};          // N -> real PNG file size in bytes
    var answer = "";         // "yes" or "no" in the challenge

    function commas(n) {
      return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    }

    function fitFont(ctx, text, weight, startPx, maxWidth) {
      var px = startPx;
      ctx.font = weight + " " + px + "px " + FONT_STACK;
      var w = ctx.measureText(text).width;
      if (w > maxWidth) {
        px = Math.floor(px * maxWidth / w);
        ctx.font = weight + " " + px + "px " + FONT_STACK;
      }
      return px;
    }

    function drawBook(ctx, x, y, w, h, fill, band) {
      ctx.fillStyle = fill;
      ctx.fillRect(x, y, w, h);
      ctx.fillStyle = band;
      ctx.fillRect(x + 70, y, 44, h);
      ctx.fillRect(x + w - 114, y, 44, h);
      ctx.fillStyle = "#FFF8E7";            // page edges
      ctx.fillRect(x + w - 26, y + 20, 26, h - 40);
    }

    function drawPoster() {
      var c = document.createElement("canvas");
      c.width = SRC_W;
      c.height = SRC_H;
      var ctx = c.getContext("2d", { willReadFrequently: true });

      ctx.fillStyle = "#17365D";
      ctx.fillRect(0, 0, SRC_W, SRC_H);

      ctx.fillStyle = "#FFF8E7";
      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";
      fitFont(ctx, "BOOK CLUB", 800, 236, 1300);
      ctx.fillText("BOOK CLUB", SRC_W / 2, 300);

      // A stack of three books, made from rectangles.
      drawBook(ctx, 478, 410, 560, 130, "#F2695C", "#B93E33");
      drawBook(ctx, 408, 540, 700, 130, "#F5B841", "#C98A12");
      drawBook(ctx, 448, 670, 640, 130, "#6FCFA9", "#2F8F6B");

      ctx.fillStyle = "#FFF8E7";
      fitFont(ctx, "Every Thursday, Lunchtime", 800, 104, 1380);
      ctx.fillText("Every Thursday, Lunchtime", SRC_W / 2, 1010);

      srcData = ctx.getImageData(0, 0, SRC_W, SRC_H).data;
      cache = {};
    }

    /* Average each f x f square of the big poster into one pixel. */
    function lowRes(n) {
      if (cache[n]) return cache[n];
      var f = SRC_W / n;
      var m = SRC_H / f;
      var c = document.createElement("canvas");
      c.width = n;
      c.height = m;
      var ctx = c.getContext("2d");
      var out = ctx.createImageData(n, m);
      var o = out.data;
      var area = f * f;
      for (var y = 0; y < m; y++) {
        for (var x = 0; x < n; x++) {
          var r = 0, g = 0, b = 0;
          for (var yy = 0; yy < f; yy++) {
            var i = ((y * f + yy) * SRC_W + x * f) * 4;
            for (var xx = 0; xx < f; xx++) {
              r += srcData[i]; g += srcData[i + 1]; b += srcData[i + 2];
              i += 4;
            }
          }
          var j = (y * n + x) * 4;
          o[j] = r / area; o[j + 1] = g / area; o[j + 2] = b / area; o[j + 3] = 255;
        }
      }
      ctx.putImageData(out, 0, 0);
      cache[n] = c;
      return c;
    }

    /* The poster takes the space left above the slider and the status line. */
    function layout() {
      if (!area.clientHeight) return;
      var cs = getComputedStyle(area);
      var gap = parseFloat(cs.rowGap) || 10;
      var availW = area.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      var availH = area.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom)
                   - slider.offsetHeight - 8 - statusEl.offsetHeight - gap * 2 - 4;
      var h = Math.max(150, Math.min(440, Math.floor(availH)));
      var w = Math.round(h * 4 / 3);
      if (w > availW) { w = Math.floor(availW); h = Math.round(w * 3 / 4); }
      view = { w: w, h: h };
      big.style.width = w + "px";
      big.style.height = h + "px";
      slider.style.width = Math.max(300, w) + "px";
      render();
    }

    function render() {
      if (!srcData || !view.w) return;
      var n = STEPS[Number(slider.value)];
      var img = lowRes(n);
      var m = img.height;
      var dpr = window.devicePixelRatio || 1;

      /* The small image stretched to the same poster size every time. */
      var bw = Math.round(view.w * dpr), bh = Math.round(view.h * dpr);
      if (big.width !== bw || big.height !== bh) { big.width = bw; big.height = bh; }
      var bctx = big.getContext("2d");
      /* Smoothing stays OFF whenever the image is being stretched, so each pixel
         shows as a block. It is only on when the image has more pixels than the
         space on screen and has to be shrunk to fit. */
      bctx.imageSmoothingEnabled = n > bw;
      bctx.imageSmoothingQuality = "high";
      bctx.clearRect(0, 0, bw, bh);
      bctx.drawImage(img, 0, 0, n, m, 0, 0, bw, bh);

      Explorer.status(statusText(n), n === CLEAR && Explorer.step() === 1 ? "good" : "");
      slider.setAttribute("aria-valuetext", n + " pixels across, " + commas(n * m) + " pixels in all");
      big.setAttribute("aria-label", "The poster made from " + n + " pixels across, shown at poster size.");
    }

    /* Start screen demo: the real 8-pixel and 128-pixel posters. */
    function drawDemo() {
      [["rz-d-low", 8], ["rz-d-high", 128]].forEach(function (d) {
        var c = document.getElementById(d[0]);
        var img = lowRes(d[1]);
        c.width = 240; c.height = 180;
        var ctx = c.getContext("2d");
        ctx.imageSmoothingEnabled = d[1] > 240;
        ctx.drawImage(img, 0, 0, img.width, img.height, 0, 0, 240, 180);
      });
    }

    function note() {
      var n = STEPS[Number(slider.value)];
      if (n <= LOW) beenLow = true;
    }

    /* The real size of this image saved as a PNG. */
    function fileKB(n) {
      if (!sizes[n]) {
        var url = lowRes(n).toDataURL("image/png");
        sizes[n] = Math.round((url.length - url.indexOf(",") - 1) * 3 / 4);
      }
      var k = sizes[n] / 1000;
      return (k < 10 ? Math.round(k * 10) / 10 : Math.round(k)) + " KB";
    }

    /* One line: the pixels, the file size, and (in step 1) where they are. */
    function statusText(n) {
      var base = n + " pixels across. File: " + fileKB(n) + ".";
      if (Explorer.step() !== 1) return base;
      if (n < 96) return base;
      if (n === 96) return base + " Nearly. Some letters are still fuzzy.";
      if (n === CLEAR) return base + " Every word is clear.";
      return base + " Clear. Can you use fewer?";
    }

    slider.addEventListener("input", function () {
      var i = Number(slider.value);
      if (i === lastIndex) return;
      lastIndex = i;
      note();
      render();
      Explorer.used();
    });

    function pick(which) {
      answer = which;
      yesBtn.setAttribute("aria-pressed", which === "yes" ? "true" : "false");
      noBtn.setAttribute("aria-pressed", which === "no" ? "true" : "false");
      Explorer.answer();
      if (which === "yes") Explorer.hint("Compare 128 and 512. Are the words any clearer? Look at the file size.");
    }
    yesBtn.addEventListener("click", function () { pick("yes"); });
    noBtn.addEventListener("click", function () { pick("no"); });

    /* The Yes / No buttons sit straight after the challenge sentence. */
    var instruction = document.getElementById("ex-instruction");
    function showAnswers(on) {
      answers.hidden = !on;
      if (on) instruction.parentNode.insertBefore(answers, instruction.nextSibling);
      yesBtn.removeAttribute("aria-pressed");
      noBtn.removeAttribute("aria-pressed");
      answer = "";
    }

    Explorer.setup({
      keyword: { word: "Resolution", meaning: "How many pixels a picture has.", tile: "shared/tiles/resolution.png" },
      bridge: { title: "Now in Canva", img: "shared/canva/download-size.png", imgW: 818, imgH: 145, crop: [0, 818], focus: [14, 790], alt: "Canva Download panel with the Size slider ringed", text: "Click Share. Click Download. Size shows the pixels." },
      pulse: "#rz-slider",
      success: function () { return beenLow && STEPS[Number(slider.value)] === CLEAR; },
      successText: "128 pixels: the fewest where every word is clear.",
      hint: function () { return STEPS[Number(slider.value)] > CLEAR ? "Slide left until just before the words go fuzzy." : "Slide right until every word is clear."; },
      hintAfter: 60,
      onShow: layout,
      onReset: function () {
        slider.value = START_INDEX;
        lastIndex = START_INDEX;
        beenLow = false;
        note();
        showAnswers(false);
        render();
      },
      challenge: {
        text: "Are the most pixels always best?",
        start: function () { showAnswers(true); render(); },
        success: function () { return answer === "no"; },
        successText: "No. Once the words are clear, more pixels only make a bigger file.",
        hint: "Move the slider. Watch the words and the file size.",
        pulse: "#rz-answers .ex-btn"
      }
    });
    note();

    if (window.ResizeObserver) new ResizeObserver(layout).observe(area);
    window.addEventListener("resize", layout);

    /* Draw straight away with whatever font is ready, then again once the
       rounded font has loaded so the poster text matches the page. */
    drawPoster();
    drawDemo();
    layout();
    if (document.fonts && document.fonts.ready) {
      var redraw = function () { drawPoster(); drawDemo(); render(); };
      document.fonts.ready.then(redraw);
      if (document.fonts.load) {
        document.fonts.load('800 100px "Nunito"').then(redraw, function () {});
      }
    }
  })();
</script>
</body>
</html>
